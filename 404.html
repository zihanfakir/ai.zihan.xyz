<!DOCTYPE html>
<html lang="bn">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
  <title>পৃষ্ঠা খুঁজে পাওয়া যায়নি — Alora</title>
  <link rel="icon" type="image/svg+xml" href="favicon.svg">
  <link rel="icon" type="image/png" sizes="32x32" href="favicon-32x32.png">
  <link rel="icon" type="image/png" sizes="16x16" href="favicon-16x16.png">
  <link rel="apple-touch-icon" href="apple-touch-icon.png">
  <script>
    // GitHub Pages Clean URL Router
    (function() {
      var pathname = window.location.pathname;
      var clean = pathname.replace(/\/+$/, '');
      if (clean && !clean.endsWith('.html') && !clean.includes('.')) {
        var target = clean + '.html' + window.location.search + window.location.hash;
        window.location.replace(target);
      }
    })();
  </script>
  <style>
    :root {
      --bg: #09090b;
      --card-bg: #121215;
      --border: rgba(255, 255, 255, 0.08);
      --text: #f4f4f5;
      --text-sub: #a1a1aa;
      --primary: #3b82f6;
    }
    * { box-sizing: border-box; margin: 0; padding: 0; }
    body {
      background: var(--bg);
      color: var(--text);
      font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, 'Hind Siliguri', sans-serif;
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 24px;
      text-align: center;
    }
    .box {
      max-width: 440px;
      width: 100%;
      background: var(--card-bg);
      border: 1px solid var(--border);
      border-radius: 24px;
      padding: 40px 24px;
      box-shadow: 0 20px 40px rgba(0, 0, 0, 0.6);
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 16px;
    }
    .logo {
      height: 48px;
      width: 48px;
      object-fit: contain;
      margin-bottom: 8px;
    }
    .code {
      font-size: 3.5rem;
      font-weight: 800;
      background: linear-gradient(135deg, #60a5fa, #a855f7);
      -webkit-background-clip: text;
      -webkit-text-fill-color: transparent;
      line-height: 1;
    }
    h1 {
      font-size: 1.25rem;
      font-weight: 700;
    }
    p {
      color: var(--text-sub);
      font-size: 0.95rem;
      line-height: 1.6;
    }
    .btn {
      margin-top: 12px;
      display: inline-flex;
      align-items: center;
      justify-content: center;
      gap: 8px;
      background: var(--primary);
      color: #fff;
      text-decoration: none;
      padding: 12px 28px;
      border-radius: 12px;
      font-weight: 600;
      font-size: 0.95rem;
      transition: opacity 0.2s;
    }
    .btn:hover { opacity: 0.9; }
  </style>
</head>
<body>
  <div class="box">
    <img src="logo_icon_white.png" alt="Alora Logo" class="logo">
    <div class="code">404</div>
    <h1>পৃষ্ঠাটি খুঁজে পাওয়া যায়নি</h1>
    <p>অনুরোধকৃত পাতাটি সরানো হয়েছে বা এই ঠিকানায় কোনো পৃষ্ঠা নেই।</p>
    <a href="/" class="btn">মূল পাতায় ফিরে যান</a>
  </div>
</body>
</html>

name: Build iOS App

on:
  push:
    branches: [ master ]
    paths:
      - 'ios/**'
      - '.github/workflows/build-ios.yml'
  workflow_dispatch:

jobs:
  build:
    name: Build Native iOS App
    runs-on: macos-14
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Select Xcode Version
        run: sudo xcode-select -s /Applications/Xcode_15.4.app

      - name: Build iOS App (Archive)
        run: |
          cd ios
          xcodebuild -project AloAI.xcodeproj \
                     -scheme AloAI \
                     -configuration Release \
                     -destination 'generic/platform=iOS' \
                     -derivedDataPath build \
                     CODE_SIGNING_ALLOWED=NO

      - name: Package into .IPA (For AltStore, Sideloadly, Scarlet, TrollStore)
        run: |
          cd ios/build/Build/Products/Release-iphoneos
          mkdir -p Payload
          cp -R AloAI.app Payload/
          zip -qr Alokpoth.ipa Payload
          ls -lh Alokpoth.ipa

      - name: Upload IPA Artifact
        uses: actions/upload-artifact@v4
        with:
          name: Alokpoth-iOS-IPA
          path: ios/build/Build/Products/Release-iphoneos/Alokpoth.ipa
          retention-days: 30

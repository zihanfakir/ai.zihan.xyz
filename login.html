<!DOCTYPE html>
<html lang="bn" data-theme="dark">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
  <title>লগইন ও সাইন-আপ — Alokpoth AI</title>
  <link rel="icon" type="image/png" href="app_logo.png">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Hind+Siliguri:wght@400;500;600;700&family=Plus+Jakarta+Sans:wght@400;500;600;700&display=swap" rel="stylesheet">
  
  <style>
    :root {
      --bg-base: #0a0d14;
      --bg-surface: rgba(18, 24, 38, 0.85);
      --bg-surface-hover: rgba(26, 35, 54, 0.95);
      --border-subtle: rgba(255, 255, 255, 0.08);
      --border-focus: rgba(99, 102, 241, 0.5);
      --accent-primary: #6366f1;
      --accent-gradient: linear-gradient(135deg, #6366f1, #a855f7);
      --text-main: #f8fafc;
      --text-sub: #94a3b8;
      --text-muted: #64748b;
      --danger: #ef4444;
      --success: #10b981;
      --radius-sm: 8px;
      --radius-md: 14px;
      --radius-lg: 20px;
      --font-main: 'Hind Siliguri', 'Plus Jakarta Sans', sans-serif;
    }

    [data-theme="oled"] {
      --bg-base: #000000;
      --bg-surface: rgba(12, 12, 12, 0.95);
      --border-subtle: rgba(255, 255, 255, 0.12);
      --border-focus: rgba(255, 255, 255, 0.4);
    }

    [data-theme="sapphire"] {
      --bg-base: #060913;
      --bg-surface: rgba(11, 20, 38, 0.85);
      --border-subtle: rgba(56, 189, 248, 0.12);
      --border-focus: rgba(56, 189, 248, 0.5);
      --accent-primary: #38bdf8;
      --accent-gradient: linear-gradient(135deg, #38bdf8, #818cf8);
    }

    [data-theme="light"] {
      --bg-base: #f8fafc;
      --bg-surface: rgba(255, 255, 255, 0.95);
      --bg-surface-hover: #f1f5f9;
      --border-subtle: rgba(0, 0, 0, 0.08);
      --border-focus: rgba(99, 102, 241, 0.4);
      --text-main: #0f172a;
      --text-sub: #475569;
      --text-muted: #94a3b8;
    }

    [data-theme="eyecare"] {
      --bg-base: #f5eedc;
      --bg-surface: rgba(251, 247, 239, 0.95);
      --bg-surface-hover: #ede3ce;
      --border-subtle: rgba(107, 78, 51, 0.15);
      --border-focus: rgba(146, 64, 14, 0.4);
      --text-main: #4a3b2c;
      --text-sub: #7a6b5c;
      --text-muted: #9e8e7e;
      --accent-primary: #92400e;
      --accent-gradient: linear-gradient(135deg, #b45309, #92400e);
    }

    *, *::before, *::after {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      -webkit-user-select: none !important;
      -moz-user-select: none !important;
      -ms-user-select: none !important;
      user-select: none !important;
      -webkit-touch-callout: none !important;
      -webkit-tap-highlight-color: transparent !important;
      -webkit-font-smoothing: antialiased;
      -moz-osx-font-smoothing: grayscale;
      text-rendering: optimizeLegibility;
      letter-spacing: -0.011em;
    }

    ::selection {
      background: transparent !important;
      color: inherit !important;
    }
    ::-moz-selection {
      background: transparent !important;
      color: inherit !important;
    }

    input, textarea, [contenteditable="true"] {
      -webkit-user-select: text !important;
      -moz-user-select: text !important;
      -ms-user-select: text !important;
      user-select: text !important;
      -webkit-touch-callout: default !important;
    }
    input::selection, textarea::selection {
      background: rgba(255, 255, 255, 0.25) !important;
      color: inherit !important;
    }

    button, input, select, textarea, .btn, .btn-primary, .auth-switch-btn {
      touch-action: manipulation;
    }

    button:active, .btn:active, .btn-primary:active, .auth-switch-btn:active {
      transform: scale(0.968) !important;
      transition: transform 0.1s cubic-bezier(0.16, 1, 0.3, 1) !important;
    }

    body {
      font-family: var(--font-main);
      background-color: var(--bg-base);
      color: var(--text-main);
      min-height: 100vh;
      display: flex;
      flex-direction: column;
      position: relative;
      overflow-x: hidden;
      background-image: 
        radial-gradient(circle at 15% 15%, rgba(99, 102, 241, 0.12) 0%, transparent 40%),
        radial-gradient(circle at 85% 85%, rgba(168, 85, 247, 0.1) 0%, transparent 40%);
    }

    /* Ambient Glow */
    .ambient-glow {
      position: absolute;
      top: -120px;
      left: 50%;
      transform: translateX(-50%);
      width: 600px;
      height: 350px;
      background: radial-gradient(ellipse, rgba(99, 102, 241, 0.25) 0%, rgba(99, 102, 241, 0) 70%);
      pointer-events: none;
      filter: blur(50px);
      z-index: 0;
    }

    /* Header Bar */
    .top-bar {
      display: flex;
      align-items: center;
      justify-content: space-between;
      padding: 16px 24px;
      position: relative;
      z-index: 10;
      max-width: 1200px;
      width: 100%;
      margin: 0 auto;
    }

    .brand-link {
      display: flex;
      align-items: center;
      gap: 10px;
      text-decoration: none;
      color: var(--text-main);
      font-weight: 700;
      font-size: 1.15rem;
    }

    .brand-logo {
      width: 32px;
      height: 32px;
      border-radius: 8px;
      object-fit: cover;
    }

    .top-actions {
      display: flex;
      align-items: center;
      gap: 12px;
    }

    .back-btn {
      display: inline-flex;
      align-items: center;
      gap: 6px;
      padding: 8px 16px;
      border-radius: var(--radius-md);
      background: var(--bg-surface);
      border: 1px solid var(--border-subtle);
      color: var(--text-main);
      text-decoration: none;
      font-size: 0.9rem;
      font-weight: 500;
      transition: all 0.2s;
    }

    .back-btn:hover {
      background: var(--bg-surface-hover);
      transform: translateX(-2px);
    }

    .theme-toggle-btn {
      width: 38px;
      height: 38px;
      border-radius: var(--radius-md);
      background: var(--bg-surface);
      border: 1px solid var(--border-subtle);
      color: var(--text-main);
      display: flex;
      align-items: center;
      justify-content: center;
      cursor: pointer;
      transition: all 0.2s;
    }

    .lang-toggle-btn {
      background: rgba(255, 255, 255, 0.06);
      border: 1px solid var(--border-subtle);
      color: var(--text-main);
      font-size: 0.8rem;
      font-weight: 700;
      padding: 6px 12px;
      border-radius: var(--radius-md);
      cursor: pointer;
      display: inline-flex;
      align-items: center;
      transition: all 0.2s;
    }
    .lang-toggle-btn:hover {
      background: rgba(255, 255, 255, 0.12);
      border-color: var(--accent-primary);
    }
    
    .theme-toggle-btn:hover {
      background: var(--bg-surface-hover);
    }

    /* Main Container */
    .auth-container {
      flex: 1;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 24px 16px 48px;
      position: relative;
      z-index: 5;
    }

    .auth-card {
      width: 100%;
      max-width: 440px;
      background: var(--bg-surface);
      border: 1px solid var(--border-subtle);
      border-radius: var(--radius-lg);
      padding: 36px 28px;
      backdrop-filter: blur(20px);
      -webkit-backdrop-filter: blur(20px);
      box-shadow: 0 20px 40px rgba(0, 0, 0, 0.35);
      animation: cardFadeUp 0.4s cubic-bezier(0.16, 1, 0.3, 1);
    }

    @keyframes cardFadeUp {
      from {
        opacity: 0;
        transform: translateY(20px);
      }
      to {
        opacity: 1;
        transform: translateY(0);
      }
    }

    .auth-card-header {
      text-align: center;
      margin-bottom: 28px;
    }

    .auth-badge-icon {
      width: 54px;
      height: 54px;
      margin: 0 auto 14px;
      border-radius: 16px;
      background: var(--accent-gradient);
      display: flex;
      align-items: center;
      justify-content: center;
      box-shadow: 0 8px 20px rgba(99, 102, 241, 0.35);
    }

    .auth-badge-icon img {
      width: 32px;
      height: 32px;
      object-fit: contain;
    }

    .auth-title {
      font-size: 1.5rem;
      font-weight: 700;
      color: var(--text-main);
      margin-bottom: 6px;
    }

    .auth-subtitle {
      font-size: 0.92rem;
      color: var(--text-sub);
    }

    /* Tab Switcher */
    .auth-tabs {
      display: flex;
      background: rgba(0, 0, 0, 0.2);
      border: 1px solid var(--border-subtle);
      border-radius: var(--radius-md);
      padding: 4px;
      margin-bottom: 24px;
      position: relative;
    }

    .auth-tab-btn {
      flex: 1;
      padding: 10px;
      text-align: center;
      background: transparent;
      border: none;
      color: var(--text-sub);
      font-size: 0.95rem;
      font-weight: 600;
      border-radius: 10px;
      cursor: pointer;
      transition: all 0.2s;
    }

    .auth-tab-btn.active {
      background: var(--bg-surface-hover);
      color: var(--text-main);
      box-shadow: 0 2px 8px rgba(0, 0, 0, 0.25);
    }

    /* Form Elements */
    .form-group {
      margin-bottom: 18px;
    }

    .form-label {
      display: block;
      font-size: 0.88rem;
      font-weight: 600;
      color: var(--text-main);
      margin-bottom: 8px;
    }

    .input-wrap {
      position: relative;
      display: flex;
      align-items: center;
    }

    .form-input {
      width: 100%;
      height: 46px;
      padding: 0 14px;
      background: rgba(0, 0, 0, 0.15);
      border: 1px solid var(--border-subtle);
      border-radius: var(--radius-md);
      color: var(--text-main);
      font-size: 0.95rem;
      font-family: inherit;
      outline: none;
      transition: all 0.2s;
    }

    .form-input:focus {
      border-color: var(--border-focus);
      box-shadow: 0 0 0 3px rgba(99, 102, 241, 0.15);
      background: rgba(0, 0, 0, 0.25);
    }

    .password-toggle {
      position: absolute;
      right: 12px;
      background: transparent;
      border: none;
      color: var(--text-muted);
      cursor: pointer;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 4px;
    }

    .password-toggle:hover {
      color: var(--text-main);
    }

    /* Submit Button */
    .submit-btn {
      width: 100%;
      height: 48px;
      background: var(--accent-gradient);
      color: #ffffff;
      border: none;
      border-radius: var(--radius-md);
      font-size: 1rem;
      font-weight: 600;
      font-family: inherit;
      cursor: pointer;
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 8px;
      box-shadow: 0 8px 24px rgba(99, 102, 241, 0.3);
      transition: all 0.2s;
      margin-top: 10px;
    }

    .submit-btn:hover {
      opacity: 0.95;
      transform: translateY(-1px);
      box-shadow: 0 12px 28px rgba(99, 102, 241, 0.4);
    }

    .submit-btn:active {
      transform: translateY(0);
    }

    .submit-btn:disabled {
      opacity: 0.6;
      cursor: not-allowed;
      transform: none;
    }

    /* Alert Message */
    .alert-msg {
      display: none;
      padding: 12px 14px;
      border-radius: var(--radius-md);
      font-size: 0.88rem;
      margin-bottom: 18px;
      align-items: center;
      gap: 10px;
      animation: alertSlide 0.3s ease;
    }

    @keyframes alertSlide {
      from { opacity: 0; transform: translateY(-8px); }
      to { opacity: 1; transform: translateY(0); }
    }

    .alert-msg.error {
      display: flex;
      background: rgba(239, 68, 68, 0.12);
      border: 1px solid rgba(239, 68, 68, 0.3);
      color: #fca5a5;
    }

    .alert-msg.success {
      display: flex;
      background: rgba(16, 185, 129, 0.12);
      border: 1px solid rgba(16, 185, 129, 0.3);
      color: #6ee7b7;
    }

    /* Logged in state box */
    .logged-in-box {
      display: none;
      text-align: center;
      padding: 20px 0;
    }

    .user-avatar-lg {
      width: 68px;
      height: 68px;
      border-radius: 50%;
      background: var(--accent-gradient);
      color: #ffffff;
      font-size: 1.8rem;
      font-weight: 700;
      display: flex;
      align-items: center;
      justify-content: center;
      margin: 0 auto 16px;
      box-shadow: 0 8px 24px rgba(99, 102, 241, 0.35);
    }

    .logged-name {
      font-size: 1.25rem;
      font-weight: 700;
      color: var(--text-main);
      margin-bottom: 4px;
    }

    .logged-email {
      font-size: 0.9rem;
      color: var(--text-sub);
      margin-bottom: 24px;
    }

    .action-links {
      display: flex;
      flex-direction: column;
      gap: 12px;
    }

    .btn-secondary {
      width: 100%;
      height: 44px;
      background: rgba(255, 255, 255, 0.05);
      border: 1px solid var(--border-subtle);
      border-radius: var(--radius-md);
      color: var(--text-main);
      font-size: 0.95rem;
      font-weight: 600;
      cursor: pointer;
      text-decoration: none;
      display: inline-flex;
      align-items: center;
      justify-content: center;
      transition: all 0.2s;
    }

    .btn-secondary:hover {
      background: rgba(255, 255, 255, 0.1);
    }

    .btn-danger-outline {
      width: 100%;
      height: 44px;
      background: rgba(239, 68, 68, 0.08);
      border: 1px solid rgba(239, 68, 68, 0.25);
      border-radius: var(--radius-md);
      color: #f87171;
      font-size: 0.95rem;
      font-weight: 600;
      cursor: pointer;
      transition: all 0.2s;
    }

    .btn-danger-outline:hover {
      background: rgba(239, 68, 68, 0.16);
    }

    /* Footer Note */
    .auth-footer-note {
      text-align: center;
      margin-top: 24px;
      font-size: 0.82rem;
      color: var(--text-muted);
    }

    .auth-footer-note a {
      color: var(--accent-primary);
      text-decoration: none;
    }

    .auth-footer-note a:hover {
      text-decoration: underline;
    }
  </style>
</head>
<body>
  <div class="ambient-glow"></div>

  <header class="top-bar">
    <a href="index.html" class="brand-link">
      <span>Alokpoth AI</span>
    </a>
    <div class="top-actions">
      <button type="button" class="lang-toggle-btn" id="langToggleBtn" title="ভাষা পরিবর্তন / Switch Language">
        <span id="langBtnText">EN</span>
      </button>
      <button type="button" class="theme-toggle-btn" id="themeToggleBtn" title="থিম পরিবর্তন">
        <svg viewBox="0 0 24 24" width="18" height="18" fill="none" stroke="currentColor" stroke-width="2"><path d="M12 3a9 9 0 1 0 9 9c0-.46-.04-.92-.1-1.36a5.389 5.389 0 0 1-4.4 2.26 5.403 5.403 0 0 1-3.14-9.8c-.44-.06-.9-.1-1.36-.1z"/></svg>
      </button>
      <a href="index.html" class="back-btn">
        <svg viewBox="0 0 24 24" width="16" height="16" fill="none" stroke="currentColor" stroke-width="2"><line x1="19" y1="12" x2="5" y2="12"></line><polyline points="12 19 5 12 12 5"></polyline></svg>
        <span id="backToChatText">চ্যাটে ফিরে যান</span>
      </a>
    </div>
  </header>

  <main class="auth-container">
    <div class="auth-card">
      <div class="auth-card-header">
        <div class="auth-badge-icon">
          <svg viewBox="0 0 24 24" style="width:26px;height:26px;fill:none;stroke:#fff;stroke-width:2;"><rect x="3" y="11" width="18" height="11" rx="2" ry="2"/><path d="M7 11V7a5 5 0 0 1 10 0v4"/></svg>
        </div>
        <h1 class="auth-title" id="cardTitle">স্বাগতম!</h1>
        <p class="auth-subtitle" id="cardSubtitle">Alokpoth AI-তে প্রবেশ করতে লগইন করুন</p>
      </div>

      <!-- If already logged in, show this container -->
      <div class="logged-in-box" id="loggedInBox">
        <div class="user-avatar-lg" id="loggedAvatar">অ</div>
        <div class="logged-name" id="loggedName">ব্যবহারকারীর নাম</div>
        <div class="logged-email" id="loggedEmail">user@example.com</div>
        <div class="action-links">
          <a href="index.html" class="submit-btn" id="goToChatBtn" style="text-decoration:none;">চ্যাটে যান</a>
          <a href="account.html" class="btn-secondary" id="viewAccountBtn">অ্যাকাউন্ট ও প্ল্যান দেখুন</a>
          <button type="button" class="btn-danger-outline" id="logoutBtn">লগআউট করুন</button>
        </div>
      </div>

      <!-- Auth Form Container -->
      <div id="authFormContainer">
        <div class="auth-tabs">
          <button type="button" class="auth-tab-btn active" id="tabLoginBtn">লগইন</button>
          <button type="button" class="auth-tab-btn" id="tabRegisterBtn">নতুন অ্যাকাউন্ট</button>
        </div>

        <div class="alert-msg" id="alertBox"></div>

        <form id="authForm">
          <div class="form-group" id="nameGroup" style="display:none;">
            <label class="form-label" id="nameLabel" for="userNameInput">আপনার পূর্ণ নাম</label>
            <div class="input-wrap">
              <input type="text" class="form-input" id="userNameInput" placeholder="যেমন: রিফাত হোসেন" autocomplete="name">
            </div>
          </div>

          <div class="form-group">
            <label class="form-label" id="emailLabel" for="userEmailInput">ইমেইল ঠিকানা</label>
            <div class="input-wrap">
              <input type="email" class="form-input" id="userEmailInput" placeholder="name@example.com" required autocomplete="email">
            </div>
          </div>

          <div class="form-group">
            <label class="form-label" id="passLabel" for="userPassInput">পাসওয়ার্ড</label>
            <div class="input-wrap">
              <input type="password" class="form-input" id="userPassInput" placeholder="কমপক্ষে ৬ অক্ষরের পাসওয়ার্ড" required autocomplete="current-password">
              <button type="button" class="password-toggle" id="passToggleBtn" aria-label="পাসওয়ার্ড দেখুন">
                <svg viewBox="0 0 24 24" width="18" height="18" fill="none" stroke="currentColor" stroke-width="2"><path d="M1 12s4-8 11-8 11 8 11 8-4 8-11 8-11-8-11-8z"></path><circle cx="12" cy="12" r="3"></circle></svg>
              </button>
            </div>
          </div>

          <button type="submit" class="submit-btn" id="submitAuthBtn">
            <span id="submitBtnText">লগইন করুন</span>
          </button>
        </form>

        <div class="auth-footer-note">
          <span id="forgotPassText">পাসওয়ার্ড ভুলে গেছেন? এডমিনের সাথে যোগাযোগ করুন।</span>
        </div>
      </div>
    </div>
  </main>

  <script>
    // Language i18n dictionary
    const I18N_LOGIN = {
      bn: {
        pageTitle: "লগইন ও সাইন-আপ — Alokpoth AI",
        backToChat: "চ্যাটে ফিরে যান",
        themeToggle: "থিম পরিবর্তন",
        welcomeTitle: "স্বাগতম!",
        welcomeSub: "Alokpoth AI-তে প্রবেশ করতে লগইন করুন",
        registerTitle: "নতুন অ্যাকাউন্ট তৈরি",
        registerSub: "Alokpoth AI-এর সাথে শুরু করুন",
        tabLogin: "লগইন",
        tabRegister: "নতুন অ্যাকাউন্ট",
        nameLabel: "আপনার পূর্ণ নাম",
        namePlaceholder: "যেমন: রিফাত হোসেন",
        emailLabel: "ইমেইল ঠিকানা",
        emailPlaceholder: "name@example.com",
        passLabel: "পাসওয়ার্ড",
        passPlaceholder: "কমপক্ষে ৬ অক্ষরের পাসওয়ার্ড",
        submitLogin: "লগইন করুন",
        submitRegister: "অ্যাকাউন্ট তৈরি করুন",
        submittingLogin: "যাচাই করা হচ্ছে...",
        submittingRegister: "অ্যাকাউন্ট তৈরি হচ্ছে...",
        forgotPass: "পাসওয়ার্ড ভুলে গেছেন? এডমিনের সাথে যোগাযোগ করুন।",
        loggedInTitle: "আপনি লগইন অবস্থায় আছেন",
        loggedInSub: "Alokpoth AI প্রফাইল ও চ্যাট অ্যাক্সেস করুন",
        defaultUser: "ব্যবহারকারী",
        goToChat: "চ্যাটে যান",
        viewAccount: "অ্যাকাউন্ট ও প্ল্যান দেখুন",
        logoutBtn: "লগআউট করুন",
        logoutSuccess: "লগআউট সফল হয়েছে!",
        errEmailPass: "অনুগ্রহ করে ইমেইল এবং পাসওয়ার্ড প্রদান করুন।",
        errName: "অনুগ্রহ করে আপনার নাম প্রদান করুন।",
        errServer: "সার্ভারের সাথে যোগাযোগ করা যায়নি। আপনার ইন্টারনেট সংযোগ পরীক্ষা করুন।",
        loginSuccess: "লগইন সফল হয়েছে! চ্যাটে নিয়ে যাওয়া হচ্ছে...",
        registerSuccess: "অ্যাকাউন্ট তৈরি সফল হয়েছে! চ্যাটে নিয়ে যাওয়া হচ্ছে..."
      },
      en: {
        pageTitle: "Log In & Sign Up — Alokpoth AI",
        backToChat: "Back to Chat",
        themeToggle: "Change Theme",
        welcomeTitle: "Welcome Back!",
        welcomeSub: "Sign in to access Alokpoth AI",
        registerTitle: "Create an Account",
        registerSub: "Get started with Alokpoth AI",
        tabLogin: "Log In",
        tabRegister: "Create Account",
        nameLabel: "Your Full Name",
        namePlaceholder: "e.g. John Doe",
        emailLabel: "Email Address",
        emailPlaceholder: "name@example.com",
        passLabel: "Password",
        passPlaceholder: "At least 6 characters",
        submitLogin: "Log In",
        submitRegister: "Create Account",
        submittingLogin: "Authenticating...",
        submittingRegister: "Creating account...",
        forgotPass: "Forgot password? Contact the administrator.",
        loggedInTitle: "You are currently logged in",
        loggedInSub: "Access your Alokpoth AI profile and chats",
        defaultUser: "User",
        goToChat: "Go to Chat",
        viewAccount: "View Account & Plans",
        logoutBtn: "Log Out",
        logoutSuccess: "Logged out successfully!",
        errEmailPass: "Please provide both email and password.",
        errName: "Please enter your full name.",
        errServer: "Could not connect to server. Please check your connection.",
        loginSuccess: "Login successful! Redirecting to chat...",
        registerSuccess: "Account created successfully! Redirecting to chat..."
      }
    };

    let currentLanguage = localStorage.getItem("alokpoth_lang") || "bn";
    document.documentElement.setAttribute("lang", currentLanguage);

    function applyLoginI18n() {
      const d = I18N_LOGIN[currentLanguage] || I18N_LOGIN.bn;
      const isEn = (currentLanguage === "en");

      document.title = d.pageTitle;
      document.documentElement.setAttribute("lang", currentLanguage);

      const langBtnText = document.getElementById("langBtnText");
      if (langBtnText) langBtnText.textContent = isEn ? "বাংলা" : "English";

      const backToChatText = document.getElementById("backToChatText");
      if (backToChatText) backToChatText.textContent = d.backToChat;

      const themeToggleBtn = document.getElementById("themeToggleBtn");
      if (themeToggleBtn) themeToggleBtn.title = d.themeToggle;

      const tabLoginBtn = document.getElementById("tabLoginBtn");
      if (tabLoginBtn) tabLoginBtn.textContent = d.tabLogin;

      const tabRegisterBtn = document.getElementById("tabRegisterBtn");
      if (tabRegisterBtn) tabRegisterBtn.textContent = d.tabRegister;

      const nameLabel = document.getElementById("nameLabel");
      if (nameLabel) nameLabel.textContent = d.nameLabel;

      const userNameInput = document.getElementById("userNameInput");
      if (userNameInput) userNameInput.placeholder = d.namePlaceholder;

      const emailLabel = document.getElementById("emailLabel");
      if (emailLabel) emailLabel.textContent = d.emailLabel;

      const userEmailInput = document.getElementById("userEmailInput");
      if (userEmailInput) userEmailInput.placeholder = d.emailPlaceholder;

      const passLabel = document.getElementById("passLabel");
      if (passLabel) passLabel.textContent = d.passLabel;

      const userPassInput = document.getElementById("userPassInput");
      if (userPassInput) userPassInput.placeholder = d.passPlaceholder;

      const forgotPassText = document.getElementById("forgotPassText");
      if (forgotPassText) forgotPassText.textContent = d.forgotPass;

      const goToChatBtn = document.getElementById("goToChatBtn");
      if (goToChatBtn) goToChatBtn.textContent = d.goToChat;

      const viewAccountBtn = document.getElementById("viewAccountBtn");
      if (viewAccountBtn) viewAccountBtn.textContent = d.viewAccount;

      const logoutBtn = document.getElementById("logoutBtn");
      if (logoutBtn) logoutBtn.textContent = d.logoutBtn;

      if (typeof setMode === "function") {
        setMode(currentMode);
      }
    }

    const langToggleBtn = document.getElementById("langToggleBtn");
    if (langToggleBtn) {
      langToggleBtn.addEventListener("click", () => {
        currentLanguage = (currentLanguage === "en" ? "bn" : "en");
        try { localStorage.setItem("alokpoth_lang", currentLanguage); } catch {}
        applyLoginI18n();
      });
    }

    // Theme sync
    const savedTheme = localStorage.getItem("alokpoth_theme") || localStorage.getItem("alokpoth-theme") || "dark";
    document.documentElement.setAttribute("data-theme", savedTheme);

    const THEME_META_COLORS = {
      dark: "#09090b",
      sapphire: "#070d19",
      oled: "#000000",
      eyecare: "#f5eedc",
      light: "#f9fafb"
    };

    function updateThemeMetaColor(t) {
      let meta = document.querySelector('meta[name="theme-color"]');
      if (!meta) {
        meta = document.createElement('meta');
        meta.setAttribute('name', 'theme-color');
        document.head.appendChild(meta);
      }
      meta.setAttribute('content', THEME_META_COLORS[t] || '#09090b');
    }
    updateThemeMetaColor(savedTheme);

    const themeToggleBtn = document.getElementById("themeToggleBtn");
    const themes = ["dark", "sapphire", "oled", "eyecare", "light"];
    themeToggleBtn.addEventListener("click", () => {
      const cur = document.documentElement.getAttribute("data-theme") || "dark";
      const next = themes[(themes.indexOf(cur) + 1) % themes.length];
      document.documentElement.setAttribute("data-theme", next);
      localStorage.setItem("alokpoth_theme", next);
      localStorage.setItem("alokpoth-theme", next);
      updateThemeMetaColor(next);
    });

    // Smart API Base
    const isLocal = window.location.hostname === 'localhost' || window.location.hostname === '127.0.0.1';
    const BACKEND_URL = (isLocal && window.location.port === '5000') 
      ? window.location.origin 
      : (window.location.origin.includes('vercel.app') ? window.location.origin : "https://ai-zihan-xyz.vercel.app");
    const API_BASE = BACKEND_URL + "/api";

    // Mode handling
    let currentMode = "login";
    const urlParams = new URLSearchParams(window.location.search);
    if (urlParams.get("mode") === "register") {
      currentMode = "register";
    }

    const tabLoginBtn = document.getElementById("tabLoginBtn");
    const tabRegisterBtn = document.getElementById("tabRegisterBtn");
    const nameGroup = document.getElementById("nameGroup");
    const cardTitle = document.getElementById("cardTitle");
    const cardSubtitle = document.getElementById("cardSubtitle");
    const submitBtnText = document.getElementById("submitBtnText");
    const alertBox = document.getElementById("alertBox");
    const authForm = document.getElementById("authForm");
    const userNameInput = document.getElementById("userNameInput");
    const userEmailInput = document.getElementById("userEmailInput");
    const userPassInput = document.getElementById("userPassInput");
    const passToggleBtn = document.getElementById("passToggleBtn");
    const submitAuthBtn = document.getElementById("submitAuthBtn");

    const loggedInBox = document.getElementById("loggedInBox");
    const authFormContainer = document.getElementById("authFormContainer");
    const loggedAvatar = document.getElementById("loggedAvatar");
    const loggedName = document.getElementById("loggedName");
    const loggedEmail = document.getElementById("loggedEmail");
    const logoutBtn = document.getElementById("logoutBtn");

    // Check if user is already logged in
    function checkLoggedInState() {
      const d = I18N_LOGIN[currentLanguage] || I18N_LOGIN.bn;
      const token = localStorage.getItem("alokpoth_token");
      const userStr = localStorage.getItem("alokpoth_user");
      if (token && userStr) {
        try {
          const user = JSON.parse(userStr);
          if (user && user.email) {
            authFormContainer.style.display = "none";
            loggedInBox.style.display = "block";
            cardTitle.textContent = d.loggedInTitle;
            cardSubtitle.textContent = d.loggedInSub;
            loggedName.textContent = user.name || d.defaultUser;
            loggedEmail.textContent = user.email;
            loggedAvatar.textContent = (user.name || user.email || "U").charAt(0).toUpperCase();
            return true;
          }
        } catch {}
      }
      authFormContainer.style.display = "block";
      loggedInBox.style.display = "none";
      return false;
    }

    if (logoutBtn) {
      logoutBtn.addEventListener("click", () => {
        const d = I18N_LOGIN[currentLanguage] || I18N_LOGIN.bn;
        try {
          localStorage.removeItem("alokpoth_token");
          localStorage.removeItem("alokpoth_user");
          localStorage.removeItem("alokpoth_account_name");
          localStorage.removeItem("alokpoth_plan_expires_at");
          localStorage.removeItem("alokpoth_plan_expiry");
          localStorage.removeItem("alokpoth_usage_window");
          localStorage.setItem("alokpoth_current_plan", "Free");
          localStorage.setItem("alokpoth_plan", "Free");
          localStorage.setItem("alokpoth_user_plan", "Free");
        } catch (e) {}
        showAlert(d.logoutSuccess, "success");
        setTimeout(() => {
          window.location.reload();
        }, 500);
      });
    }

    function setMode(mode) {
      currentMode = mode;
      const d = I18N_LOGIN[currentLanguage] || I18N_LOGIN.bn;
      alertBox.style.display = "none";
      if (mode === "login") {
        tabLoginBtn.classList.add("active");
        tabRegisterBtn.classList.remove("active");
        nameGroup.style.display = "none";
        cardTitle.textContent = d.welcomeTitle;
        cardSubtitle.textContent = d.welcomeSub;
        submitBtnText.textContent = d.submitLogin;
      } else {
        tabRegisterBtn.classList.add("active");
        tabLoginBtn.classList.remove("active");
        nameGroup.style.display = "block";
        cardTitle.textContent = d.registerTitle;
        cardSubtitle.textContent = d.registerSub;
        submitBtnText.textContent = d.submitRegister;
      }
    }

    tabLoginBtn.addEventListener("click", () => setMode("login"));
    tabRegisterBtn.addEventListener("click", () => setMode("register"));

    // Password Toggle
    let showPass = false;
    passToggleBtn.addEventListener("click", () => {
      showPass = !showPass;
      userPassInput.type = showPass ? "text" : "password";
      passToggleBtn.style.color = showPass ? "var(--accent-primary)" : "var(--text-muted)";
    });

    function showAlert(msg, type = "error") {
      alertBox.textContent = msg;
      alertBox.className = "alert-msg " + type;
      alertBox.style.display = "flex";
    }

    // Submit handler
    authForm.addEventListener("submit", async (e) => {
      e.preventDefault();
      alertBox.style.display = "none";
      const d = I18N_LOGIN[currentLanguage] || I18N_LOGIN.bn;

      const email = userEmailInput.value.trim().toLowerCase();
      const password = userPassInput.value;
      const name = userNameInput.value.trim();

      if (!email || !password) {
        showAlert(d.errEmailPass, "error");
        return;
      }

      if (currentMode === "register" && !name) {
        showAlert(d.errName, "error");
        return;
      }

      submitAuthBtn.disabled = true;
      submitBtnText.textContent = currentMode === "login" ? d.submittingLogin : d.submittingRegister;

      try {
        const endpoint = currentMode === "login" ? `${API_BASE}/auth/login` : `${API_BASE}/auth/register`;
        const payload = currentMode === "login" ? { email, password } : { name, email, password };

        const res = await fetch(endpoint, {
          method: "POST",
          headers: { "Content-Type": "application/json" },
          body: JSON.stringify(payload)
        });

        const data = await res.json();

        if (res.ok && data.token) {
          localStorage.setItem("alokpoth_token", data.token);
          if (data.user) {
            localStorage.setItem("alokpoth_user", JSON.stringify(data.user));
            const isAdmin = data.user.role === "admin" || (data.user.email && data.user.email.toLowerCase().trim() === "zihanfakir@gmail.com");
            const planName = isAdmin ? "Max" : ((data.user.subscription && data.user.subscription.plan_name) || data.user.plan || "Free");
            const expiresAt = (!isAdmin && data.user.subscription && data.user.subscription.expires_at) || null;
            localStorage.setItem("alokpoth_current_plan", planName);
            localStorage.setItem("alokpoth_user_plan", planName);
            localStorage.setItem("alokpoth_plan", planName);
            if (expiresAt) {
              localStorage.setItem("alokpoth_plan_expiry", expiresAt);
              localStorage.setItem("alokpoth_plan_expires_at", expiresAt);
            } else {
              localStorage.removeItem("alokpoth_plan_expiry");
              localStorage.removeItem("alokpoth_plan_expires_at");
            }
          }

          showAlert(currentMode === "login" ? d.loginSuccess : d.registerSuccess, "success");

          setTimeout(() => {
            const redirect = urlParams.get("redirect") || "index.html";
            window.location.href = redirect;
          }, 800);
        } else {
          showAlert(data.error || (currentLanguage === "en" ? "Request failed. Please verify your details." : "কার্য সম্পন্ন করা সম্ভব হয়নি। অনুগ্রহ করে তথ্য যাচাই করুন।"), "error");
          submitAuthBtn.disabled = false;
          submitBtnText.textContent = currentMode === "login" ? d.submitLogin : d.submitRegister;
        }
      } catch (err) {
        showAlert(d.errServer, "error");
        submitAuthBtn.disabled = false;
        submitBtnText.textContent = currentMode === "login" ? d.submitLogin : d.submitRegister;
      }
    });

    // Run initial state and i18n
    applyLoginI18n();
    checkLoggedInState();
  </script>
</body>
</html>

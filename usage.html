<!DOCTYPE html>
<html lang="bn" data-theme="oled">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
  <meta name="theme-color" content="#000000">
  <title>Usage &amp; Quota — Alo AI</title>
  <link rel="icon" type="image/png" href="app_logo.png">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Hind+Siliguri:wght@400;500;600;700&family=Plus+Jakarta+Sans:wght@400;500;600;700&display=swap" rel="stylesheet">
  
  <style>
    :root {
      --bg-base: #000000;
      --bg-card: #18181b;
      --bg-card-hover: #222226;
      --border-card: rgba(255, 255, 255, 0.08);
      --border-divider: rgba(255, 255, 255, 0.06);
      --text-main: #ffffff;
      --text-sub: #71717a;
      --text-dim: #a1a1aa;
      --accent-blue: #3b82f6;
      --accent-blue-hover: #2563eb;
      --accent-danger: #ef4444;
      --font-main: 'Plus Jakarta Sans', 'Hind Siliguri', -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
    }

    [data-theme="dark"] {
      --bg-base: #09090b;
      --bg-card: #18181b;
      --bg-card-hover: #222226;
      --border-card: rgba(255, 255, 255, 0.08);
      --border-divider: rgba(255, 255, 255, 0.06);
      --text-main: #ffffff;
      --text-sub: #71717a;
    }

    [data-theme="oled"] {
      --bg-base: #000000;
      --bg-card: #111113;
      --bg-card-hover: #1c1c1f;
      --border-card: rgba(255, 255, 255, 0.12);
      --border-divider: rgba(255, 255, 255, 0.06);
      --text-main: #ffffff;
      --text-sub: #71717a;
    }

    [data-theme="sapphire"] {
      --bg-base: #070d19;
      --bg-card: #0f1c32;
      --bg-card-hover: #152744;
      --border-card: rgba(56, 189, 248, 0.15);
      --border-divider: rgba(56, 189, 248, 0.08);
      --text-main: #f8fafc;
      --text-sub: #94a3b8;
    }

    [data-theme="eyecare"] {
      --bg-base: #f5eedc;
      --bg-card: #eadeca;
      --bg-card-hover: #dfcfb8;
      --border-card: rgba(146, 64, 14, 0.15);
      --border-divider: rgba(146, 64, 14, 0.08);
      --text-main: #4a3b2c;
      --text-sub: #7a6b5c;
      --text-dim: #9e8e7e;
    }

    [data-theme="light"] {
      --bg-base: #f4f4f5;
      --bg-card: #ffffff;
      --bg-card-hover: #f8fafc;
      --border-card: rgba(0, 0, 0, 0.08);
      --border-divider: rgba(0, 0, 0, 0.05);
      --text-main: #09090b;
      --text-sub: #71717a;
      --text-dim: #52525b;
    }

    *, *::before, *::after {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      -webkit-tap-highlight-color: transparent !important;
      -webkit-font-smoothing: antialiased;
    }

    body {
      font-family: var(--font-main);
      background-color: var(--bg-base);
      color: var(--text-main);
      min-height: 100vh;
      display: flex;
      flex-direction: column;
      position: relative;
      overflow-x: hidden;
      padding-bottom: max(32px, env(safe-area-inset-bottom, 20px));
      transition: background-color 0.2s ease;
    }

    /* Top Navigation Bar */
    .settings-nav {
      position: sticky;
      top: 0;
      z-index: 50;
      background: var(--bg-base);
      border-bottom: 1px solid var(--border-divider);
      display: flex;
      align-items: center;
      justify-content: space-between;
      height: 56px;
      padding: 0 16px;
      backdrop-filter: blur(12px);
      -webkit-backdrop-filter: blur(12px);
    }

    .settings-back-link {
      display: inline-flex;
      align-items: center;
      gap: 6px;
      color: var(--text-main);
      text-decoration: none;
      font-size: 1rem;
      font-weight: 600;
      cursor: pointer;
      padding: 6px 8px;
      border-radius: 8px;
      transition: opacity 0.15s;
    }
    .settings-back-link:active {
      opacity: 0.7;
    }
    .settings-back-link svg {
      width: 20px;
      height: 20px;
      stroke-width: 2.4;
      stroke: currentColor;
      fill: none;
      stroke-linecap: round;
      stroke-linejoin: round;
    }

    .nav-title {
      font-size: 1.05rem;
      font-weight: 700;
      color: var(--text-main);
    }

    .nav-actions {
      display: flex;
      align-items: center;
      gap: 10px;
    }

    .lang-pill-btn {
      background: rgba(255, 255, 255, 0.08);
      border: 1px solid var(--border-card);
      color: var(--text-main);
      font-size: 0.8rem;
      font-weight: 600;
      padding: 5px 10px;
      border-radius: 9999px;
      cursor: pointer;
      transition: background 0.15s;
    }
    .lang-pill-btn:active {
      background: rgba(255, 255, 255, 0.15);
    }

    /* Main Container */
    .content-container {
      width: 100%;
      max-width: 580px;
      margin: 0 auto;
      padding: 20px 16px 40px;
      display: flex;
      flex-direction: column;
      gap: 16px;
    }

    .settings-card {
      background: var(--bg-card);
      border: 1px solid var(--border-card);
      border-radius: 16px;
      padding: 20px;
      box-shadow: 0 2px 8px rgba(0, 0, 0, 0.2);
    }

    /* Quota Card */
    .quota-meter-box {
      background: rgba(0, 0, 0, 0.35);
      border: 1px solid var(--border-card);
      border-radius: 14px;
      padding: 16px;
    }

    .account-quota-track {
      height: 8px;
      background: rgba(255, 255, 255, 0.08);
      border-radius: 9999px;
      overflow: hidden;
      margin: 12px 0 10px;
    }

    .account-quota-fill {
      height: 100%;
      width: 100%;
      background: linear-gradient(90deg, #2563eb, #38bdf8);
      border-radius: 9999px;
      transition: width 0.4s ease;
    }
    .account-quota-fill.warning {
      background: linear-gradient(90deg, #f59e0b, #fbbf24);
    }
    .account-quota-fill.danger {
      background: linear-gradient(90deg, #ef4444, #f87171);
    }

    /* Stats Grid */
    .stats-2col {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 12px;
    }

    .stat-pill {
      background: rgba(255, 255, 255, 0.03);
      border: 1px solid var(--border-card);
      border-radius: 14px;
      padding: 14px;
    }

    .stat-val-num {
      font-size: 1.35rem;
      font-weight: 700;
      color: var(--text-main);
      line-height: 1.2;
    }

    .stat-val-label {
      font-size: 0.8rem;
      color: var(--text-sub);
      margin-top: 4px;
    }

    .quota-subtext {
      font-size: 0.82rem;
      color: var(--text-sub);
      line-height: 1.5;
      margin-top: 4px;
    }

    @keyframes spin {
      from { transform: rotate(0deg); }
      to { transform: rotate(360deg); }
    }
    .spin {
      animation: spin 0.75s linear infinite;
    }

    /* Toast */
    .toast {
      position: fixed;
      bottom: max(20px, env(safe-area-inset-bottom, 20px));
      left: 50%;
      transform: translateX(-50%);
      padding: 10px 18px;
      border-radius: 9999px;
      font-size: 0.88rem;
      font-weight: 500;
      color: #ffffff;
      background: rgba(24, 24, 27, 0.95);
      border: 1px solid rgba(255, 255, 255, 0.15);
      box-shadow: 0 10px 25px rgba(0, 0, 0, 0.5);
      z-index: 1000;
      display: none;
      backdrop-filter: blur(8px);
      -webkit-backdrop-filter: blur(8px);
      white-space: nowrap;
    }
    .toast.success { border-color: #10b981; }
    .toast.error { border-color: #ef4444; }
  </style>
</head>
<body>
  <div id="toastEl" class="toast"></div>

  <!-- Top Navigation -->
  <header class="settings-nav">
    <a href="account.html" class="settings-back-link" id="backBtn">
      <svg viewBox="0 0 24 24"><polyline points="15 18 9 12 15 6"/></svg>
      <span id="backText">Settings</span>
    </a>
    <div class="nav-title" id="pageTitle">Usage &amp; Quota</div>
    <div class="nav-actions">
      <button type="button" class="lang-pill-btn" id="refreshQuotaBtn" title="Refresh Quota" style="display:inline-flex;align-items:center;justify-content:center;padding:5px 8px;">
        <svg id="refreshIcon" viewBox="0 0 24 24" width="15" height="15" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round"><path d="M21.5 2v6h-6M2.5 22v-6h6M2 11.5a10 10 0 0 1 18.8-4.3M22 12.5a10 10 0 0 1-18.8 4.2"/></svg>
      </button>
      <button type="button" class="lang-pill-btn" id="langToggleBtn" title="Language Switch">
        <span id="langBtnText">EN</span>
      </button>
    </div>
  </header>

  <main class="content-container">
    <!-- Message Quota Card -->
    <div class="settings-card">
      <div class="quota-meter-box">
        <div style="display: flex; justify-content: space-between; align-items: center; font-size: 0.95rem;">
          <span style="font-weight: 700; display: flex; align-items: center; gap: 6px;" id="quotaCardTitle">
            <svg viewBox="0 0 24 24" width="18" height="18" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M21 15a2 2 0 0 1-2 2H7l-4 4V5a2 2 0 0 1 2-2h14a2 2 0 0 1 2 2z"/></svg>
            <span id="quotaCardTitleText">Message Quota</span>
          </span>
          <span id="quotaCountDisplay"><strong id="quotaRemainingDigits">10</strong> / <span id="quotaTotalDigits">10</span> left</span>
        </div>
        <div class="account-quota-track">
          <div class="account-quota-fill" id="accountQuotaFill"></div>
        </div>
        <div style="display: flex; justify-content: space-between; font-size: 0.84rem; color: var(--text-sub);">
          <span id="quotaResetLabel">Reset in:</span>
          <span id="quotaLiveCountdown" style="font-weight: 600; color: var(--text-main);">Full quota available</span>
        </div>
      </div>
    </div>

    <!-- Image Generation Quota Card -->
    <div class="settings-card" id="imageQuotaCard">
      <div class="quota-meter-box">
        <div style="display: flex; justify-content: space-between; align-items: center; font-size: 0.95rem;">
          <span style="font-weight: 700; display: flex; align-items: center; gap: 6px;" id="imageQuotaCardTitle">
            <svg viewBox="0 0 24 24" width="18" height="18" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" style="color: #ec4899;"><rect x="3" y="3" width="18" height="18" rx="2" ry="2"/><circle cx="8.5" cy="8.5" r="1.5"/><polyline points="21 15 16 10 5 21"/></svg>
            <span id="imageQuotaTitleText">Image Generation Quota</span>
          </span>
          <span id="imageQuotaCountDisplay"><strong id="imageQuotaRemainingDigits">5</strong> / <span id="imageQuotaTotalDigits">5</span> left</span>
        </div>
        <div class="account-quota-track">
          <div class="account-quota-fill" id="accountImageQuotaFill" style="background: linear-gradient(90deg, #ec4899, #8b5cf6);"></div>
        </div>
        <div style="display: flex; justify-content: space-between; font-size: 0.84rem; color: var(--text-sub);">
          <span id="imageQuotaResetLabel">Reset in:</span>
          <span id="imageQuotaLiveCountdown" style="font-weight: 600; color: var(--text-main);">Full quota available</span>
        </div>
      </div>
    </div>

    <!-- 4 Stats Grid -->
    <div class="stats-2col">
      <div class="stat-pill">
        <div class="stat-val-num" id="usageCountVal">0</div>
        <div class="stat-val-label" id="labelUsageSent">Sent this window</div>
      </div>
      <div class="stat-pill">
        <div class="stat-val-num" id="usageRemainingVal">10</div>
        <div class="stat-val-label" id="labelUsageRemaining">Messages left</div>
      </div>
      <div class="stat-pill">
        <div class="stat-val-num" id="usageResetVal">3h</div>
        <div class="stat-val-label" id="labelUsageReset">Refresh cycle</div>
      </div>
      <div class="stat-pill">
        <div class="stat-val-num" id="totalMessagesSent">1</div>
        <div class="stat-val-label" id="labelUsageSessions">Total sessions</div>
      </div>
    </div>

    <!-- Fair Usage Policy Card -->
    <div class="settings-card">
      <div style="font-size: 0.95rem; font-weight: 700; color: var(--text-main); margin-bottom: 6px;" id="fairUsageTitle">
        Fair Usage Policy
      </div>
      <p class="quota-subtext" id="quotaWindowSubtext">
        Fair usage quota automatically refreshes every cycle.
      </p>
    </div>
  </main>

  <script>
    const isLocal = window.location.hostname === 'localhost' || window.location.hostname === '127.0.0.1';
    const BACKEND_URL = (isLocal && window.location.port === '5000') 
      ? window.location.origin 
      : (isLocal ? 'http://localhost:5000' : (window.location.origin.includes('vercel.app') ? window.location.origin : 'https://ai-zihan-xyz.vercel.app'));
    const API_BASE = BACKEND_URL + "/api";

    const token = localStorage.getItem("alokpoth_token");
    if (!token) {
      window.location.href = "login.html";
    }

    let currentLanguage = localStorage.getItem("alokpoth_lang") || "bn";
    const savedTheme = localStorage.getItem("alokpoth_theme") || localStorage.getItem("alokpoth-theme") || "oled";
    document.documentElement.setAttribute("data-theme", savedTheme);

    const metaTag = document.querySelector('meta[name="theme-color"]');
    const THEME_META_COLORS = {
      dark: "#09090b",
      oled: "#000000",
      sapphire: "#070d19",
      eyecare: "#f5eedc",
      light: "#f4f4f5"
    };
    if (metaTag && THEME_META_COLORS[savedTheme]) {
      metaTag.setAttribute("content", THEME_META_COLORS[savedTheme]);
    }

    let toastTimer = null;
    function showToast(msg, type = "success") {
      const el = document.getElementById("toastEl");
      if (!el) return;
      el.textContent = msg;
      el.className = `toast ${type}`;
      el.style.display = "block";
      if (toastTimer) clearTimeout(toastTimer);
      toastTimer = setTimeout(() => { el.style.display = "none"; }, 2500);
    }

    function decodeJWT(t) {
      try {
        const base64Url = t.split('.')[1];
        const base64 = base64Url.replace(/-/g, '+').replace(/_/g, '/');
        const jsonPayload = decodeURIComponent(atob(base64).split('').map(c => '%' + ('00' + c.charCodeAt(0).toString(16)).slice(-2)).join(''));
        return JSON.parse(jsonPayload);
      } catch(e) { return null; }
    }

    let dynamicPlanLimits = {
      Free: { limit: 10, image_limit: 5, hours: 3 },
      Pro: { limit: 30, image_limit: 25, hours: 3 },
      Max: { limit: 50, image_limit: 100, hours: 1 }
    };

    const I18N = {
      bn: {
        back: "সেটিংস",
        pageTitle: "ব্যবহার ও কোটা",
        quotaCardTitle: "বার্তা কোটা",
        imageQuotaCardTitle: "ছবি তৈরির কোটা",
        quotaResetLabel: "রিসেট বাকি:",
        imageQuotaResetLabel: "রিসেট বাকি:",
        labelUsageSent: "এই উইন্ডোতে পাঠানো",
        labelUsageRemaining: "অবশিষ্ট বার্তা সংখ্যা",
        labelUsageReset: "কোটা সাইকেল",
        labelUsageSessions: "মোট চ্যাট সেশন",
        fairUsageTitle: "ফেয়ার ইউসেজ পলিসি",
        fullQuota: "কোটা সম্পূর্ণ পূর্ণ",
        adminUnlimitedNotice: "অ্যাডমিন অ্যাকাউন্টে সমস্ত এআই মডেল এবং বার্তায় কোনো সীমা ছাড়াই পূর্ণ এক্সেস রয়েছে।",
        adminUnlimitedBadge: "সীমাহীন (কোনো সীমা নেই)",
        adminAccess: "সীমাহীন এক্সেস",
        refreshed: "কোটা তথ্য সফলভাবে রিফ্রেশ হয়েছে"
      },
      en: {
        back: "Settings",
        pageTitle: "Usage & Quota",
        quotaCardTitle: "Message Quota",
        imageQuotaCardTitle: "Image Generation Quota",
        quotaResetLabel: "Reset in:",
        imageQuotaResetLabel: "Reset in:",
        labelUsageSent: "Sent this window",
        labelUsageRemaining: "Messages left",
        labelUsageReset: "Refresh cycle",
        labelUsageSessions: "Total sessions",
        fairUsageTitle: "Fair Usage Policy",
        fullQuota: "Full quota available",
        adminUnlimitedNotice: "Admin account has unlimited access to all AI models and messages without rate limits.",
        adminUnlimitedBadge: "Unlimited (No Limit)",
        adminAccess: "Unlimited Access",
        refreshed: "Quota successfully refreshed"
      }
    };

    function formatDigits(num) {
      if (currentLanguage !== "bn") return String(num);
      const bnDigits = ["০","১","২","৩","৪","৫","৬","৭","৮","৯"];
      return String(num).replace(/[0-9]/g, d => bnDigits[Number(d)] || d);
    }

    function applyI18n() {
      const isEn = (currentLanguage === "en");
      const d = I18N[currentLanguage] || I18N.en;

      document.getElementById("langBtnText").textContent = isEn ? "বাং" : "EN";
      document.getElementById("backText").textContent = d.back;
      document.getElementById("pageTitle").textContent = d.pageTitle;
      const quotaTitleEl = document.getElementById("quotaCardTitleText");
      if (quotaTitleEl) quotaTitleEl.textContent = d.quotaCardTitle;
      const imgQuotaTitleEl = document.getElementById("imageQuotaTitleText");
      if (imgQuotaTitleEl) imgQuotaTitleEl.textContent = d.imageQuotaCardTitle;
      document.getElementById("quotaResetLabel").textContent = d.quotaResetLabel;
      const imgResetLabelEl = document.getElementById("imageQuotaResetLabel");
      if (imgResetLabelEl) imgResetLabelEl.textContent = d.imageQuotaResetLabel;
      document.getElementById("labelUsageSent").textContent = d.labelUsageSent;
      document.getElementById("labelUsageRemaining").textContent = d.labelUsageRemaining;
      document.getElementById("labelUsageReset").textContent = d.labelUsageReset;
      document.getElementById("labelUsageSessions").textContent = d.labelUsageSessions;
      document.getElementById("fairUsageTitle").textContent = d.fairUsageTitle;
      document.title = `${d.pageTitle} — Alo AI`;
    }

    function renderUserData() {
      let user = null;
      try {
        const userStr = localStorage.getItem("alokpoth_user");
        if (userStr) user = JSON.parse(userStr);
      } catch {}

      if (!user && token) {
        const decoded = decodeJWT(token);
        if (decoded) {
          user = {
            role: decoded.role || "user",
            email: decoded.email || "",
            plan: decoded.plan || "Free"
          };
        }
      }
      if (!user) {
        user = {
          role: "user",
          plan: localStorage.getItem("alokpoth_current_plan") || "Free"
        };
      }

      const isEn = (currentLanguage === "en");
      const d = I18N[currentLanguage] || I18N.en;

      try {
        const adminEmails = ["zihanfakir@gmail.com", "x@zihan.uk"];
        const isAdmin = (user.role === "admin" || (user.email && adminEmails.includes(user.email.toLowerCase().trim())));

        let currentPlan = isAdmin ? "Max" : ((user.subscription && user.subscription.plan_name) || user.plan || localStorage.getItem("alokpoth_current_plan") || "Free");

        const planConf = dynamicPlanLimits[currentPlan] || dynamicPlanLimits.Free;
        const limit = planConf.limit;
        const hours = planConf.hours;

        let used = 0;
        let usage = null;
        try {
          usage = JSON.parse(localStorage.getItem("alokpoth_window_usage") || localStorage.getItem("alokpoth_usage_window") || "null");
          if (usage && usage.count !== undefined) used = Number(usage.count) || 0;
        } catch {}

        const windowMs = hours * 60 * 60 * 1000;
        let msRemaining = 0;
        if (usage && usage.resetAt) {
          msRemaining = Math.max(0, new Date(usage.resetAt).getTime() - Date.now());
        } else if (usage && usage.start) {
          msRemaining = Math.max(0, (usage.start + windowMs) - Date.now());
        }

        if (msRemaining <= 0 && used > 0) {
          used = 0;
          msRemaining = 0;
          try {
            if (usage) {
              usage.count = 0;
              usage.start = Date.now();
              usage.resetAt = null;
              localStorage.setItem("alokpoth_window_usage", JSON.stringify(usage));
              localStorage.setItem("alokpoth_usage_window", JSON.stringify(usage));
            }
          } catch {}
          syncUserDataFromServer();
        }

        const remaining = Math.max(0, limit - used);

        const countValEl = document.getElementById("usageCountVal");
        if (countValEl) countValEl.textContent = formatDigits(used);

        const remValEl = document.getElementById("usageRemainingVal");
        const fillEl = document.getElementById("accountQuotaFill");
        const timerEl = document.getElementById("quotaLiveCountdown");
        const quotaCountDisplayEl = document.getElementById("quotaCountDisplay");
        const usageResetEl = document.getElementById("usageResetVal");
        const quotaWindowSubtextEl = document.getElementById("quotaWindowSubtext");

        const totalSec = Math.max(0, Math.floor(msRemaining / 1000));
        const hLeft = Math.floor(totalSec / 3600);
        const mLeft = Math.floor((totalSec % 3600) / 60);
        const sLeft = totalSec % 60;

        let timeLeftStr = "";
        if (used === 0) {
          timeLeftStr = d.fullQuota;
        } else if (hLeft > 0) {
          timeLeftStr = isEn ? `${hLeft}h ${mLeft}m ${sLeft}s` : `${formatDigits(hLeft)} ঘণ্টা ${formatDigits(mLeft)} মিনিট ${formatDigits(sLeft)} সেকেন্ড`;
        } else if (mLeft > 0) {
          timeLeftStr = isEn ? `${mLeft}m ${sLeft}s` : `${formatDigits(mLeft)} মিনিট ${formatDigits(sLeft)} সেকেন্ড`;
        } else {
          timeLeftStr = isEn ? `${sLeft}s` : `${formatDigits(sLeft)} সেকেন্ড`;
        }

        if (isAdmin) {
          if (quotaCountDisplayEl) {
            quotaCountDisplayEl.innerHTML = `<strong id="quotaRemainingDigits" style="color:var(--accent-blue);">${isEn ? "Unlimited" : "সীমাহীন"}</strong> (No Limit)`;
          }
          if (remValEl) remValEl.textContent = isEn ? "Unlimited" : "সীমাহীন";
          if (usageResetEl) usageResetEl.textContent = isEn ? "Unlimited" : "সীমাহীন";
          if (fillEl) {
            fillEl.style.width = "100%";
            fillEl.className = "account-quota-fill";
          }
          if (timerEl) timerEl.textContent = d.adminAccess;
          if (quotaWindowSubtextEl) {
            quotaWindowSubtextEl.textContent = d.adminUnlimitedNotice;
          }
        } else {
          if (quotaCountDisplayEl) {
            quotaCountDisplayEl.innerHTML = isEn
              ? `<strong id="quotaRemainingDigits">${remaining}</strong> / <span id="quotaTotalDigits">${limit}</span> left`
              : `<strong id="quotaRemainingDigits">${formatDigits(remaining)}</strong> / <span id="quotaTotalDigits">${formatDigits(limit)}</span> বাকি`;
          }
          if (remValEl) remValEl.textContent = formatDigits(remaining);
          if (usageResetEl) usageResetEl.textContent = isEn ? `${hours}h` : `${formatDigits(hours)} ঘণ্টা`;
          const pct = limit > 0 ? Math.max(0, Math.min(100, Math.round((remaining / limit) * 100))) : 0;
          if (fillEl) {
            fillEl.style.width = `${pct}%`;
            if (remaining <= 0 || pct <= 15) {
              fillEl.className = "account-quota-fill danger";
            } else if (pct <= 35) {
              fillEl.className = "account-quota-fill warning";
            } else {
              fillEl.className = "account-quota-fill";
            }
          }
          if (timerEl) timerEl.textContent = timeLeftStr;
          if (quotaWindowSubtextEl) {
            quotaWindowSubtextEl.textContent = isEn
              ? `Fair usage quota automatically refreshes ${limit} messages every ${hours} hour${hours > 1 ? "s" : ""}.`
              : `ফেয়ার ইউসেজ কোটা প্রতি ${formatDigits(hours)} ঘণ্টায় ${formatDigits(limit)}টি বার্তা স্বয়ংক্রিয়ভাবে নবায়ন হয়।`;
          }
        }

        // Image Generation Quota calculation
        const imgLimit = (planConf && planConf.image_limit !== undefined) ? planConf.image_limit : (currentPlan === "Max" ? 100 : (currentPlan === "Pro" ? 25 : 5));
        let imgUsed = 0;
        let imgUsage = null;
        try {
          imgUsage = JSON.parse(localStorage.getItem("alokpoth_image_window_usage") || "null");
          if (imgUsage && imgUsage.count !== undefined) imgUsed = Number(imgUsage.count) || 0;
        } catch {}

        let imgMsRemaining = 0;
        if (imgUsage && imgUsage.resetAt) {
          imgMsRemaining = Math.max(0, new Date(imgUsage.resetAt).getTime() - Date.now());
        } else if (imgUsage && imgUsage.start) {
          imgMsRemaining = Math.max(0, (imgUsage.start + windowMs) - Date.now());
        }

        if (imgMsRemaining <= 0 && imgUsed > 0) {
          imgUsed = 0;
          imgMsRemaining = 0;
          try {
            if (imgUsage) {
              imgUsage.count = 0;
              imgUsage.start = Date.now();
              imgUsage.resetAt = null;
              localStorage.setItem("alokpoth_image_window_usage", JSON.stringify(imgUsage));
            }
          } catch {}
        }

        const imgRemaining = Math.max(0, imgLimit - imgUsed);
        const imgFillEl = document.getElementById("accountImageQuotaFill");
        const imgTimerEl = document.getElementById("imageQuotaLiveCountdown");
        const imgCountDisplayEl = document.getElementById("imageQuotaCountDisplay");

        const imgTotalSec = Math.max(0, Math.floor(imgMsRemaining / 1000));
        const imgHLeft = Math.floor(imgTotalSec / 3600);
        const imgMLeft = Math.floor((imgTotalSec % 3600) / 60);
        const imgSLeft = imgTotalSec % 60;

        let imgTimeLeftStr = "";
        if (imgUsed === 0) {
          imgTimeLeftStr = d.fullQuota;
        } else if (imgHLeft > 0) {
          imgTimeLeftStr = isEn ? `${imgHLeft}h ${imgMLeft}m ${imgSLeft}s` : `${formatDigits(imgHLeft)} ঘণ্টা ${formatDigits(imgMLeft)} মিনিট ${formatDigits(imgSLeft)} সেকেন্ড`;
        } else if (imgMLeft > 0) {
          imgTimeLeftStr = isEn ? `${imgMLeft}m ${imgSLeft}s` : `${formatDigits(imgMLeft)} মিনিট ${formatDigits(imgSLeft)} সেকেন্ড`;
        } else {
          imgTimeLeftStr = isEn ? `${imgSLeft}s` : `${formatDigits(imgSLeft)} সেকেন্ড`;
        }

        if (isAdmin) {
          if (imgCountDisplayEl) {
            imgCountDisplayEl.innerHTML = `<strong style="color:var(--accent-blue);">${isEn ? "Unlimited" : "সীমাহীন"}</strong> (No Limit)`;
          }
          if (imgFillEl) {
            imgFillEl.style.width = "100%";
          }
          if (imgTimerEl) imgTimerEl.textContent = d.adminAccess;
        } else {
          if (imgCountDisplayEl) {
            imgCountDisplayEl.innerHTML = isEn
              ? `<strong>${imgRemaining}</strong> / <span>${imgLimit}</span> left`
              : `<strong>${formatDigits(imgRemaining)}</strong> / <span>${formatDigits(imgLimit)}</span> বাকি`;
          }
          const imgPct = imgLimit > 0 ? Math.max(0, Math.min(100, Math.round((imgRemaining / imgLimit) * 100))) : 0;
          if (imgFillEl) {
            imgFillEl.style.width = `${imgPct}%`;
            if (imgRemaining <= 0 || imgPct <= 15) {
              imgFillEl.style.background = "#ef4444";
            } else if (imgPct <= 35) {
              imgFillEl.style.background = "#f59e0b";
            } else {
              imgFillEl.style.background = "linear-gradient(90deg, #ec4899, #8b5cf6)";
            }
          }
          if (imgTimerEl) imgTimerEl.textContent = imgTimeLeftStr;
        }

        const allSessions = localStorage.getItem("alokpoth_chat_sessions");
        let sessionCount = 0;
        if (allSessions) {
          try {
            const parsed = JSON.parse(allSessions);
            sessionCount = Array.isArray(parsed) ? parsed.length : 1;
          } catch { sessionCount = 1; }
        }
        const totalMsgEl = document.getElementById("totalMessagesSent");
        if (totalMsgEl) totalMsgEl.textContent = formatDigits(sessionCount);
      } catch (e) {
        console.error(e);
      }
    }

    async function syncDynamicPlans() {
      try {
        const res = await fetch(`${API_BASE}/plans`, {
          headers: token ? { "Authorization": `Bearer ${token}` } : {}
        });
        const data = await res.json();
        if (res.ok && data.success && Array.isArray(data.plans)) {
          data.plans.forEach(p => {
            dynamicPlanLimits[p.name] = {
              limit: Number(p.message_limit) || (p.name === 'Free' ? 10 : (p.name === 'Pro' ? 30 : 50)),
              image_limit: Number(p.image_limit) || (p.name === 'Free' ? 5 : (p.name === 'Pro' ? 25 : 100)),
              hours: Number(p.window_hours) || (p.name === 'Max' ? 1 : 3)
            };
          });
          renderUserData();
        }
      } catch (e) {}
    }

    async function syncUserDataFromServer() {
      if (!token) return;
      try {
        const res = await fetch(`${API_BASE}/auth/me`, {
          headers: { "Authorization": `Bearer ${token}` }
        });
        const data = await res.json();
        if (res.ok && data.success && data.user) {
          localStorage.setItem("alokpoth_user", JSON.stringify(data.user));
          if (data.usage) {
            try {
              localStorage.setItem("alokpoth_window_usage", JSON.stringify(data.usage));
              localStorage.setItem("alokpoth_usage_window", JSON.stringify(data.usage));
            } catch {}
          }
          renderUserData();
        }
      } catch (e) {}
    }

    // Refresh Quota Button
    document.getElementById("refreshQuotaBtn")?.addEventListener("click", async () => {
      const icon = document.getElementById("refreshIcon");
      if (icon) icon.classList.add("spin");
      try {
        await Promise.all([syncDynamicPlans(), syncUserDataFromServer()]);
      } catch (err) {}
      renderUserData();
      if (icon) icon.classList.remove("spin");
      const d = I18N[currentLanguage] || I18N.en;
      showToast(d.refreshed);
    });

    // Back button
    document.getElementById("backBtn")?.addEventListener("click", (e) => {
      if (window.history.length > 1 && document.referrer && document.referrer.includes(window.location.host)) {
        e.preventDefault();
        window.history.back();
      }
    });

    // Toggle Language
    document.getElementById("langToggleBtn")?.addEventListener("click", () => {
      currentLanguage = (currentLanguage === "en" ? "bn" : "en");
      try { localStorage.setItem("alokpoth_lang", currentLanguage); } catch {}
      applyI18n();
      renderUserData();
    });

    applyI18n();
    renderUserData();
    syncDynamicPlans();
    syncUserDataFromServer();

    setInterval(() => {
      renderUserData();
    }, 1000);
  </script>
</body>
</html>

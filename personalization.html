<!DOCTYPE html>
<html lang="bn" data-theme="oled">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover, interactive-widget=resizes-content">
  <meta name="theme-color" content="#000000">
  <title>Custom Prompt — Alora</title>
  <link rel="icon" type="image/svg+xml" href="favicon.svg?v=3">
  <link rel="icon" type="image/png" sizes="32x32" href="favicon-32x32.png?v=3">
  <link rel="icon" type="image/png" sizes="16x16" href="favicon-16x16.png?v=3">
  <link rel="shortcut icon" href="favicon.ico?v=3">
  <link rel="apple-touch-icon" sizes="180x180" href="apple-touch-icon.png?v=3">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Hind+Siliguri:wght@400;500;600;700&family=Plus+Jakarta+Sans:wght@400;500;600;700&display=swap" rel="stylesheet">
  
  <style>
    :root {
      --bg-base: #000000;
      --bg-card: #18181b;
      --bg-card-hover: #222226;
      --border-card: rgba(255, 255, 255, 0.08);
      --border-divider: rgba(255, 255, 255, 0.06);
      --text-main: #ffffff;
      --text-sub: #71717a;
      --text-dim: #a1a1aa;
      --accent-blue: #3b82f6;
      --accent-blue-hover: #2563eb;
      --accent-danger: #ef4444;
      --font-main: 'Plus Jakarta Sans', 'Hind Siliguri', -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
    }

    [data-theme="dark"] {
      --bg-base: #09090b;
      --bg-card: #18181b;
      --bg-card-hover: #222226;
      --border-card: rgba(255, 255, 255, 0.08);
      --border-divider: rgba(255, 255, 255, 0.06);
      --text-main: #ffffff;
      --text-sub: #71717a;
    }

    [data-theme="oled"] {
      --bg-base: #000000;
      --bg-card: #111113;
      --bg-card-hover: #1c1c1f;
      --border-card: rgba(255, 255, 255, 0.12);
      --border-divider: rgba(255, 255, 255, 0.06);
      --text-main: #ffffff;
      --text-sub: #71717a;
    }

    [data-theme="sapphire"] {
      --bg-base: #070d19;
      --bg-card: #0f1c32;
      --bg-card-hover: #152744;
      --border-card: rgba(56, 189, 248, 0.15);
      --border-divider: rgba(56, 189, 248, 0.08);
      --text-main: #f8fafc;
      --text-sub: #94a3b8;
    }

    [data-theme="eyecare"] {
      --bg-base: #f5eedc;
      --bg-card: #eadeca;
      --bg-card-hover: #dfcfb8;
      --border-card: rgba(146, 64, 14, 0.15);
      --border-divider: rgba(146, 64, 14, 0.08);
      --text-main: #4a3b2c;
      --text-sub: #7a6b5c;
      --text-dim: #9e8e7e;
    }

    [data-theme="light"] {
      --bg-base: #f4f4f5;
      --bg-card: #ffffff;
      --bg-card-hover: #f8fafc;
      --border-card: rgba(0, 0, 0, 0.08);
      --border-divider: rgba(0, 0, 0, 0.05);
      --text-main: #09090b;
      --text-sub: #71717a;
      --text-dim: #52525b;
    }

    *, *::before, *::after {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      -webkit-tap-highlight-color: transparent !important;
      -webkit-font-smoothing: antialiased;
    }

    body {
      font-family: var(--font-main);
      background-color: var(--bg-base);
      color: var(--text-main);
      min-height: 100vh;
      display: flex;
      flex-direction: column;
      position: relative;
      overflow-x: hidden;
      padding-bottom: max(32px, env(safe-area-inset-bottom, 20px));
      transition: background-color 0.2s ease;
    }

    /* Top Navigation Bar */
    .settings-nav {
      position: sticky;
      top: 0;
      z-index: 50;
      background: var(--bg-base);
      border-bottom: 1px solid var(--border-divider);
      display: flex;
      align-items: center;
      justify-content: space-between;
      height: calc(56px + env(safe-area-inset-top, 0px));
      padding: env(safe-area-inset-top, 0px) 16px 0 16px;
      backdrop-filter: blur(12px);
      -webkit-backdrop-filter: blur(12px);
    }

    .settings-back-link {
      display: inline-flex;
      align-items: center;
      gap: 6px;
      color: var(--text-main);
      text-decoration: none;
      font-size: 1rem;
      font-weight: 600;
      cursor: pointer;
      padding: 6px 8px;
      border-radius: 8px;
      transition: opacity 0.15s;
    }
    .settings-back-link:active {
      opacity: 0.7;
    }
    .settings-back-link svg {
      width: 20px;
      height: 20px;
      stroke-width: 2.4;
      stroke: currentColor;
      fill: none;
      stroke-linecap: round;
      stroke-linejoin: round;
    }

    .nav-title {
      font-size: 1.05rem;
      font-weight: 700;
      color: var(--text-main);
    }

    .nav-actions {
      display: flex;
      align-items: center;
      gap: 10px;
    }

    .lang-pill-btn {
      background: rgba(255, 255, 255, 0.08);
      border: 1px solid var(--border-card);
      color: var(--text-main);
      font-size: 0.8rem;
      font-weight: 600;
      padding: 5px 10px;
      border-radius: 9999px;
      cursor: pointer;
      transition: background 0.15s;
    }
    .lang-pill-btn:active {
      background: rgba(255, 255, 255, 0.15);
    }

    /* Main Container */
    .content-container {
      width: 100%;
      max-width: 620px;
      margin: 0 auto;
      padding: 20px 16px 40px;
      display: flex;
      flex-direction: column;
      gap: 16px;
    }

    .settings-card {
      background: var(--bg-card);
      border: 1px solid var(--border-card);
      border-radius: 16px;
      padding: 22px;
      box-shadow: 0 2px 12px rgba(0, 0, 0, 0.25);
    }

    .card-header {
      margin-bottom: 18px;
    }

    .card-title {
      font-size: 1.12rem;
      font-weight: 700;
      color: var(--text-main);
      margin-bottom: 6px;
      display: flex;
      align-items: center;
      gap: 10px;
    }
    .card-title svg {
      width: 22px;
      height: 22px;
      color: var(--accent-blue);
      stroke: currentColor;
      fill: none;
      stroke-width: 2.2;
    }

    .card-subtitle {
      font-size: 0.88rem;
      color: var(--text-sub);
      line-height: 1.5;
    }

    .form-group {
      margin-bottom: 16px;
    }

    .custom-textarea {
      width: 100%;
      min-height: 160px;
      padding: 16px;
      background: rgba(0, 0, 0, 0.35);
      border: 1px solid var(--border-card);
      border-radius: 14px;
      color: var(--text-main);
      font-size: 0.95rem;
      font-family: inherit;
      outline: none;
      resize: vertical;
      line-height: 1.6;
      transition: border-color 0.2s ease, box-shadow 0.2s ease;
    }
    .custom-textarea:focus {
      border-color: var(--accent-blue);
      box-shadow: 0 0 0 3px rgba(59, 130, 246, 0.15);
    }

    .meta-row {
      display: flex;
      justify-content: space-between;
      align-items: center;
      margin-top: 6px;
      font-size: 0.78rem;
      color: var(--text-sub);
    }

    /* Suggestion Chips */
    .suggestion-chips-wrap {
      margin-top: 14px;
    }
    .chips-label {
      display: block;
      font-size: 0.82rem;
      font-weight: 600;
      color: var(--text-sub);
      margin-bottom: 10px;
    }
    .suggestion-chips {
      display: flex;
      flex-wrap: wrap;
      gap: 8px;
    }
    .sugg-chip {
      background: rgba(255, 255, 255, 0.05);
      border: 1px solid var(--border-card);
      color: var(--text-main);
      font-size: 0.82rem;
      font-weight: 500;
      font-family: inherit;
      padding: 7px 13px;
      border-radius: 9999px;
      cursor: pointer;
      display: inline-flex;
      align-items: center;
      gap: 6px;
      transition: all 0.15s ease;
      user-select: none;
    }
    .sugg-chip:hover {
      background: rgba(59, 130, 246, 0.14);
      border-color: rgba(59, 130, 246, 0.4);
      color: #93c5fd;
    }
    .sugg-chip:active {
      transform: scale(0.96);
    }

    /* Action buttons */
    .btn-row {
      display: flex;
      gap: 10px;
      margin-top: 22px;
    }

    .btn-submit {
      flex: 1;
      height: 48px;
      border-radius: 12px;
      background: var(--accent-blue);
      color: #ffffff;
      border: none;
      font-size: 0.98rem;
      font-weight: 600;
      font-family: inherit;
      cursor: pointer;
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 8px;
      transition: background 0.15s, transform 0.1s;
    }
    .btn-submit:hover {
      background: var(--accent-blue-hover);
    }
    .btn-submit:active {
      transform: scale(0.98);
    }

    .btn-clear {
      height: 48px;
      padding: 0 18px;
      border-radius: 12px;
      background: rgba(255, 255, 255, 0.06);
      border: 1px solid var(--border-card);
      color: var(--text-sub);
      font-size: 0.95rem;
      font-weight: 600;
      font-family: inherit;
      cursor: pointer;
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 6px;
      transition: all 0.15s ease;
    }
    .btn-clear:hover {
      background: rgba(239, 68, 68, 0.15);
      border-color: rgba(239, 68, 68, 0.3);
      color: var(--accent-danger);
    }
    .btn-clear:active {
      transform: scale(0.98);
    }

    /* Toast */
    .toast {
      position: fixed;
      bottom: max(20px, env(safe-area-inset-bottom, 20px));
      left: 50%;
      transform: translateX(-50%);
      padding: 10px 18px;
      border-radius: 9999px;
      font-size: 0.88rem;
      font-weight: 500;
      color: #ffffff;
      background: rgba(24, 24, 27, 0.95);
      border: 1px solid rgba(255, 255, 255, 0.15);
      box-shadow: 0 10px 25px rgba(0, 0, 0, 0.5);
      z-index: 1000;
      display: none;
      backdrop-filter: blur(8px);
      -webkit-backdrop-filter: blur(8px);
      white-space: nowrap;
    }
    .toast.success { border-color: #10b981; }
  </style>
<script>
  (function() {
    if (window.location.pathname.endsWith('.html')) {
      var clean = window.location.pathname.replace(/\.html$/, '');
      if (clean === '/index') clean = '/';
      window.history.replaceState(null, '', clean + window.location.search + window.location.hash);
    }
  })();
</script>
</head>
<body>
  <div id="toastEl" class="toast"></div>

  <!-- Top Navigation -->
  <header class="settings-nav">
    <a href="account" class="settings-back-link" id="backBtn">
      <svg viewBox="0 0 24 24"><polyline points="15 18 9 12 15 6"/></svg>
      <span id="backText">Settings</span>
    </a>
    <div class="nav-title" id="pageTitle">Personalization</div>
    <div class="nav-actions">
      <button type="button" class="lang-pill-btn" id="langToggleBtn" title="Language Switch">
        <span id="langBtnText">EN</span>
      </button>
    </div>
  </header>

  <main class="content-container">
    <div class="settings-card">
      <div class="card-header">
        <div class="card-title">
          <svg viewBox="0 0 24 24"><path d="M12 20h9"/><path d="M16.5 3.5a2.121 2.121 0 0 1 3 3L7 19l-4 1 1-4L16.5 3.5z"/></svg>
          <span id="customPromptTitle">কাস্টম প্রম্পট</span>
        </div>
        <p class="card-subtitle" id="customPromptSubtitle">
          Alora আপনার নির্দেশমতো ঠিক যেভাবে উত্তর দেবে ও আচরণ করবে, তা এখানে নিজের মতো করে লিখে দিন। Alora আপনার দেওয়া এই প্রম্পট সর্বোচ্চ অগ্রাধিকার দিয়ে অক্ষরে অক্ষরে পালন করবে।
        </p>
      </div>

      <div class="form-group">
        <textarea class="custom-textarea" id="customInstructions" placeholder="যেমন: 'তুমি একজন অভিজ্ঞ ফুলস্ট্যাক সফটওয়্যার ইঞ্জিনিয়ার। অপ্রয়োজনীয় কথা ছাড়া সবসময় সম্পূর্ণ কার্যকরী কোড দেবে। জটিল বিষয় বাস্তব উদাহরণ দিয়ে সহজ ভাষায় বুঝিয়ে বলবে।'"></textarea>
        <div class="meta-row">
          <span id="charCount">০ অক্ষর (০ শব্দ)</span>
          <span id="priorityBadge" style="color: #60a5fa;">★ সর্বোচ্চ অগ্রাধিকার পাবে</span>
        </div>

        <div class="suggestion-chips-wrap">
          <span class="chips-label" id="chipsLabel">দ্রুত ব্যবহারের জন্য কিছু আইডিয়া:</span>
          <div class="suggestion-chips">
            <button type="button" class="sugg-chip" data-text-en="Act as a Principal Software Engineer & Architect. Provide complete, production-ready, clean code with zero placeholders and explain trade-offs clearly." data-text-bn="একজন অভিজ্ঞ প্রিন্সিপাল সফটওয়্যার ইঞ্জিনিয়ার হিসেবে পরামর্শ দেবেন। কোডের ক্ষেত্রে কোনো প্লেসহোল্ডার ছাড়া সম্পূর্ণ প্রোডাকশন কোড দেবেন।">
              👨‍💻 <span class="chip-txt" id="chipTxt1">সফটওয়্যার আর্কিটেক্ট</span>
            </button>
            <button type="button" class="sugg-chip" data-text-en="Provide concise, to-the-point answers using clean bullet points without unnecessary conversational filler." data-text-bn="অপ্রয়োজনীয় কথা বা ভূমিকা ছাড়া সরাসরি টু-দ্য-পয়েন্টে এবং সংক্ষিপ্ত বুলেট আকারে উত্তর দেবেন।">
              ⚡ <span class="chip-txt" id="chipTxt2">সংক্ষিপ্ত ও টু-দ্য-পয়েন্ট</span>
            </button>
            <button type="button" class="sugg-chip" data-text-en="Explain complex concepts simply with intuitive real-world analogies and everyday examples." data-text-bn="জটিল বিষয়গুলোকে বাস্তব জীবনের সহজ ও সুন্দর উদাহরণ দিয়ে সহজভাবে ব্যাখ্যা করবেন।">
              💡 <span class="chip-txt" id="chipTxt3">সহজ বাস্তব উদাহরণ</span>
            </button>
            <button type="button" class="sugg-chip" data-text-en="Act as an empathetic, warm, and thoughtful mentor who listens carefully and offers practical guidance." data-text-bn="একজন সহানুভূতিশীল, আন্তরিক ও অভিজ্ঞ মেন্টর হিসেবে বন্ধুভাবাপন্ন পরামর্শ দেবেন।">
              🤝 <span class="chip-txt" id="chipTxt4">সহানুভূতিশীল মেন্টর</span>
            </button>
            <button type="button" class="sugg-chip" data-text-en="Think with master-level scientific rigor, deep analytical depth, and structured multi-angle insights." data-text-bn="গভীর বিশ্লেষণধর্মী দৃষ্টিভঙ্গি, যৌক্তিক কারণ এবং গবেষণামূলক গভীর অন্তর্দৃষ্টি সহ উত্তর দেবেন।">
              🔬 <span class="chip-txt" id="chipTxt5">গভীর বিশ্লেষণ</span>
            </button>
            <button type="button" class="sugg-chip" data-text-en="Write with creative elegance, rich vocabulary, engaging rhythm, and captivating storytelling." data-text-bn="সমৃদ্ধ শব্দভাণ্ডার, চমৎকার সাহিত্যিক নান্দনিকতা ও আকর্ষণীয় ভঙ্গিতে ক্রিয়েটিভ লেখা তৈরি করবেন।">
              ✍️ <span class="chip-txt" id="chipTxt6">ক্রিয়েটিভ রাইটিং</span>
            </button>
          </div>
        </div>
      </div>

      <div class="btn-row">
        <button type="button" class="btn-submit" id="savePersonalizationBtn">
          <svg viewBox="0 0 24 24" width="18" height="18" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><path d="M19 21H5a2 2 0 0 1-2-2V5a2 2 0 0 1 2-2h11l5 5v11a2 2 0 0 1-2 2z"/><polyline points="17 21 17 13 7 13 7 21"/><polyline points="7 3 7 8 15 8"/></svg>
          <span id="btnSaveText">প্রম্পট সংরক্ষণ করুন</span>
        </button>
        <button type="button" class="btn-clear" id="clearPromptBtn" title="মুছে ফেলুন">
          <svg viewBox="0 0 24 24" width="18" height="18" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><polyline points="3 6 5 6 21 6"/><path d="M19 6v14a2 2 0 0 1-2 2H7a2 2 0 0 1-2-2V6m3 0V4a2 2 0 0 1 2-2h4a2 2 0 0 1 2 2v2"/></svg>
          <span id="btnClearText">মুছে ফেলুন</span>
        </button>
      </div>
    </div>
  </main>

  <script>
    let currentLanguage = localStorage.getItem("alokpoth_lang") || "bn";
    const rawSavedTheme = localStorage.getItem("alokpoth_theme") || localStorage.getItem("alokpoth-theme") || "system";
    const isDarkPers = window.matchMedia && window.matchMedia('(prefers-color-scheme: dark)').matches;
    const savedTheme = (rawSavedTheme === "system") ? (isDarkPers ? "dark" : "light") : rawSavedTheme;
    document.documentElement.setAttribute("data-theme", savedTheme);

    const customInstructions = document.getElementById("customInstructions");
    const charCountEl = document.getElementById("charCount");

    // Load saved prompt
    if (customInstructions) {
      customInstructions.value = localStorage.getItem("alokpoth_custom_instructions") || "";
      updateCounter();
      customInstructions.addEventListener("input", updateCounter);
    }

    function toBnNum(num) {
      const bnDigits = ['০', '১', '২', '৩', '৪', '৫', '৬', '৭', '৮', '৯'];
      return String(num).replace(/[0-9]/g, (d) => bnDigits[d]);
    }

    function updateCounter() {
      if (!customInstructions || !charCountEl) return;
      const text = customInstructions.value;
      const chars = text.length;
      const words = text.trim() ? text.trim().split(/\s+/).length : 0;
      if (currentLanguage === "bn") {
        charCountEl.textContent = `${toBnNum(chars)} অক্ষর (${toBnNum(words)} শব্দ)`;
      } else {
        charCountEl.textContent = `${chars} characters (${words} words)`;
      }
    }

    // Attach suggestion chips handlers
    document.querySelectorAll(".sugg-chip").forEach(chip => {
      chip.addEventListener("click", () => {
        const text = currentLanguage === "bn" 
          ? (chip.getAttribute("data-text-bn") || chip.getAttribute("data-text-en"))
          : (chip.getAttribute("data-text-en") || chip.getAttribute("data-text-bn"));
        if (!text || !customInstructions) return;
        const cur = customInstructions.value.trim();
        if (!cur) {
          customInstructions.value = text;
        } else if (!cur.includes(text)) {
          customInstructions.value = cur + "\n\n" + text;
        }
        updateCounter();
        customInstructions.focus();
        showToast(currentLanguage === "bn" ? "পরামর্শ যুক্ত করা হয়েছে" : "Suggestion added");
      });
    });

    const I18N = {
      bn: {
        back: "সেটিংস",
        pageTitle: "ব্যক্তিগতকরণ",
        customPromptTitle: "কাস্টম প্রম্পট",
        customPromptSubtitle: "Alora আপনার নির্দেশমতো ঠিক যেভাবে উত্তর দেবে ও আচরণ করবে, তা এখানে নিজের মতো করে লিখে দিন। Alora আপনার দেওয়া এই প্রম্পট সর্বোচ্চ অগ্রাধিকার দিয়ে অক্ষরে অক্ষরে পালন করবে।",
        placeholder: "যেমন: 'তুমি একজন অভিজ্ঞ ফুলস্ট্যাক সফটওয়্যার ইঞ্জিনিয়ার। অপ্রয়োজনীয় কথা ছাড়া সবসময় সম্পূর্ণ কার্যকরী কোড দেবে। জটিল বিষয় বাস্তব উদাহরণ দিয়ে সহজ ভাষায় বুঝিয়ে বলবে।'\n\nআপনি যেভাবে চান Alora ঠিক সেভাবেই চলবে।",
        priorityBadge: "★ সর্বোচ্চ অগ্রাধিকার পাবে",
        chipsLabel: "দ্রুত ব্যবহারের জন্য কিছু আইডিয়া:",
        chip1: "সফটওয়্যার আর্কিটেক্ট",
        chip2: "সংক্ষিপ্ত ও টু-দ্য-পয়েন্ট",
        chip3: "সহজ বাস্তব উদাহরণ",
        chip4: "সহানুভূতিশীল মেন্টর",
        chip5: "গভীর বিশ্লেষণ",
        chip6: "ক্রিয়েটিভ রাইটিং",
        btnSave: "প্রম্পট সংরক্ষণ করুন",
        btnClear: "মুছে ফেলুন",
        saved: "কাস্টম প্রম্পট সফলভাবে সংরক্ষিত হয়েছে!",
        cleared: "কাস্টম প্রম্পট মুছে ফেলা হয়েছে"
      },
      en: {
        back: "Settings",
        pageTitle: "Personalization",
        customPromptTitle: "Custom Prompt",
        customPromptSubtitle: "Instruct Alora how to behave, talk, and assist you. Alora will strictly follow whatever instructions you provide here.",
        placeholder: "e.g., 'You are a Senior Full-Stack Software Engineer. Always provide clean, production-ready code with concise explanations. Use simple real-world analogies.'\n\nAlora will adapt 100% to your needs.",
        priorityBadge: "★ Highest Priority Applied",
        chipsLabel: "Quick ideas to get started:",
        chip1: "Software Architect",
        chip2: "Concise & Direct",
        chip3: "Simple Examples",
        chip4: "Empathetic Mentor",
        chip5: "Deep Analysis",
        chip6: "Creative Writing",
        btnSave: "Save Custom Prompt",
        btnClear: "Clear",
        saved: "Custom prompt saved successfully!",
        cleared: "Custom prompt cleared"
      }
    };

    function showToast(msg) {
      const el = document.getElementById("toastEl");
      if (!el) return;
      el.textContent = msg;
      el.className = "toast success";
      el.style.display = "block";
      setTimeout(() => { el.style.display = "none"; }, 2500);
    }

    function applyI18n() {
      const isEn = (currentLanguage === "en");
      const d = I18N[currentLanguage] || I18N.en;

      document.getElementById("langBtnText").textContent = isEn ? "বাং" : "EN";
      document.getElementById("backText").textContent = d.back;
      document.getElementById("pageTitle").textContent = d.pageTitle;
      document.getElementById("customPromptTitle").textContent = d.customPromptTitle;
      document.getElementById("customPromptSubtitle").textContent = d.customPromptSubtitle;
      document.getElementById("customInstructions").placeholder = d.placeholder;
      document.getElementById("priorityBadge").textContent = d.priorityBadge;
      document.getElementById("chipsLabel").textContent = d.chipsLabel;
      for (let i = 1; i <= 6; i++) {
        const ct = document.getElementById(`chipTxt${i}`);
        if (ct && d[`chip${i}`]) ct.textContent = d[`chip${i}`];
      }
      document.getElementById("btnSaveText").textContent = d.btnSave;
      document.getElementById("btnClearText").textContent = d.btnClear;
      document.title = `${d.pageTitle} — Alora`;
      updateCounter();
    }

    document.getElementById("savePersonalizationBtn")?.addEventListener("click", () => {
      const val = customInstructions ? customInstructions.value.trim() : "";
      localStorage.setItem("alokpoth_custom_instructions", val);
      const d = I18N[currentLanguage] || I18N.en;
      showToast(d.saved);
    });

    document.getElementById("clearPromptBtn")?.addEventListener("click", () => {
      if (customInstructions) customInstructions.value = "";
      localStorage.removeItem("alokpoth_custom_instructions");
      updateCounter();
      const d = I18N[currentLanguage] || I18N.en;
      showToast(d.cleared);
    });

    // Back button navigation
    document.getElementById("backBtn")?.addEventListener("click", (e) => {
      if (window.history.length > 1 && document.referrer && document.referrer.includes(window.location.host)) {
        e.preventDefault();
        window.history.back();
      }
    });

    // Toggle Language
    document.getElementById("langToggleBtn")?.addEventListener("click", () => {
      currentLanguage = (currentLanguage === "en" ? "bn" : "en");
      try { localStorage.setItem("alokpoth_lang", currentLanguage); } catch {}
      applyI18n();
    });

    applyI18n();
  </script>
</body>

<!DOCTYPE html>
<html lang="bn" data-theme="oled">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
  <meta name="theme-color" content="#000000">
  <title>Edit Profile — Alokpoth</title>
  <link rel="icon" type="image/png" href="app_logo.png">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Hind+Siliguri:wght@400;500;600;700&family=Plus+Jakarta+Sans:wght@400;500;600;700&display=swap" rel="stylesheet">
  
  <style>
    :root {
      --bg-base: #000000;
      --bg-card: #18181b;
      --bg-card-hover: #222226;
      --border-card: rgba(255, 255, 255, 0.08);
      --border-divider: rgba(255, 255, 255, 0.06);
      --text-main: #ffffff;
      --text-sub: #71717a;
      --text-dim: #a1a1aa;
      --accent-blue: #3b82f6;
      --accent-blue-hover: #2563eb;
      --accent-danger: #ef4444;
      --font-main: 'Plus Jakarta Sans', 'Hind Siliguri', -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
    }

    [data-theme="dark"] {
      --bg-base: #09090b;
      --bg-card: #18181b;
      --bg-card-hover: #222226;
      --border-card: rgba(255, 255, 255, 0.08);
      --border-divider: rgba(255, 255, 255, 0.06);
      --text-main: #ffffff;
      --text-sub: #71717a;
    }

    [data-theme="oled"] {
      --bg-base: #000000;
      --bg-card: #111113;
      --bg-card-hover: #1c1c1f;
      --border-card: rgba(255, 255, 255, 0.12);
      --border-divider: rgba(255, 255, 255, 0.06);
      --text-main: #ffffff;
      --text-sub: #71717a;
    }

    [data-theme="sapphire"] {
      --bg-base: #070d19;
      --bg-card: #0f1c32;
      --bg-card-hover: #152744;
      --border-card: rgba(56, 189, 248, 0.15);
      --border-divider: rgba(56, 189, 248, 0.08);
      --text-main: #f8fafc;
      --text-sub: #94a3b8;
    }

    [data-theme="eyecare"] {
      --bg-base: #f5eedc;
      --bg-card: #eadeca;
      --bg-card-hover: #dfcfb8;
      --border-card: rgba(146, 64, 14, 0.15);
      --border-divider: rgba(146, 64, 14, 0.08);
      --text-main: #4a3b2c;
      --text-sub: #7a6b5c;
      --text-dim: #9e8e7e;
    }

    [data-theme="light"] {
      --bg-base: #f4f4f5;
      --bg-card: #ffffff;
      --bg-card-hover: #f8fafc;
      --border-card: rgba(0, 0, 0, 0.08);
      --border-divider: rgba(0, 0, 0, 0.05);
      --text-main: #09090b;
      --text-sub: #71717a;
      --text-dim: #52525b;
    }

    *, *::before, *::after {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      -webkit-tap-highlight-color: transparent !important;
      -webkit-font-smoothing: antialiased;
    }

    body {
      font-family: var(--font-main);
      background-color: var(--bg-base);
      color: var(--text-main);
      min-height: 100vh;
      display: flex;
      flex-direction: column;
      position: relative;
      overflow-x: hidden;
      padding-bottom: max(32px, env(safe-area-inset-bottom, 20px));
      transition: background-color 0.2s ease;
    }

    /* Top Navigation Bar */
    .settings-nav {
      position: sticky;
      top: 0;
      z-index: 50;
      background: var(--bg-base);
      border-bottom: 1px solid var(--border-divider);
      display: flex;
      align-items: center;
      justify-content: space-between;
      height: calc(56px + env(safe-area-inset-top, 0px));
      padding: env(safe-area-inset-top, 0px) 16px 0 16px;
      backdrop-filter: blur(12px);
      -webkit-backdrop-filter: blur(12px);
    }

    .settings-back-link {
      display: inline-flex;
      align-items: center;
      gap: 6px;
      color: var(--text-main);
      text-decoration: none;
      font-size: 1rem;
      font-weight: 600;
      cursor: pointer;
      padding: 6px 8px;
      border-radius: 8px;
      transition: opacity 0.15s;
    }
    .settings-back-link:active {
      opacity: 0.7;
    }
    .settings-back-link svg {
      width: 20px;
      height: 20px;
      stroke-width: 2.4;
      stroke: currentColor;
      fill: none;
      stroke-linecap: round;
      stroke-linejoin: round;
    }

    .nav-title {
      font-size: 1.05rem;
      font-weight: 700;
      color: var(--text-main);
    }

    .nav-actions {
      display: flex;
      align-items: center;
      gap: 10px;
    }

    .lang-pill-btn {
      background: rgba(255, 255, 255, 0.08);
      border: 1px solid var(--border-card);
      color: var(--text-main);
      font-size: 0.8rem;
      font-weight: 600;
      padding: 5px 10px;
      border-radius: 9999px;
      cursor: pointer;
      transition: background 0.15s;
    }
    .lang-pill-btn:active {
      background: rgba(255, 255, 255, 0.15);
    }

    /* Main Container */
    .content-container {
      width: 100%;
      max-width: 580px;
      margin: 0 auto;
      padding: 20px 16px 40px;
      display: flex;
      flex-direction: column;
      gap: 16px;
    }

    .settings-card {
      background: var(--bg-card);
      border: 1px solid var(--border-card);
      border-radius: 16px;
      padding: 20px;
      box-shadow: 0 2px 8px rgba(0, 0, 0, 0.2);
    }

    .avatar-section {
      display: flex;
      flex-direction: column;
      align-items: center;
      text-align: center;
      padding: 24px 16px 20px;
      gap: 12px;
    }

    .profile-avatar-giant {
      width: 84px;
      height: 84px;
      border-radius: 50%;
      background: linear-gradient(135deg, #2563eb, #38bdf8);
      color: #ffffff;
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 2.2rem;
      font-weight: 800;
      box-shadow: 0 8px 24px rgba(37, 99, 235, 0.35);
      border: 2px solid rgba(255, 255, 255, 0.2);
    }

    .user-email-text {
      font-size: 0.92rem;
      color: var(--text-sub);
      font-weight: 500;
    }

    .badges-row {
      display: flex;
      gap: 8px;
      justify-content: center;
      margin-top: 4px;
    }

    .badge-pill {
      font-size: 0.78rem;
      padding: 3px 10px;
      border-radius: 9999px;
      font-weight: 600;
      background: rgba(59, 130, 246, 0.15);
      color: #60a5fa;
      border: 1px solid rgba(59, 130, 246, 0.3);
    }
    .badge-pill.plan {
      background: rgba(255, 255, 255, 0.08);
      color: #e4e4e7;
      border-color: rgba(255, 255, 255, 0.15);
    }

    .form-group {
      margin-bottom: 16px;
    }

    .form-label {
      display: block;
      font-size: 0.88rem;
      font-weight: 600;
      color: var(--text-sub);
      margin-bottom: 8px;
    }

    .form-input {
      width: 100%;
      height: 48px;
      padding: env(safe-area-inset-top, 0px) 16px 0 16px;
      background: rgba(0, 0, 0, 0.35);
      border: 1px solid var(--border-card);
      border-radius: 12px;
      color: #ffffff;
      font-size: 0.98rem;
      font-family: inherit;
      outline: none;
      transition: border-color 0.15s, box-shadow 0.15s;
    }
    .form-input:focus {
      border-color: var(--accent-blue);
      box-shadow: 0 0 0 3px rgba(59, 130, 246, 0.25);
    }

    .btn-submit {
      width: 100%;
      height: 48px;
      border-radius: 12px;
      background: var(--accent-blue);
      color: #ffffff;
      border: none;
      font-size: 1rem;
      font-weight: 600;
      font-family: inherit;
      cursor: pointer;
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 8px;
      transition: background 0.15s;
      margin-top: 10px;
    }
    .btn-submit:hover {
      background: var(--accent-blue-hover);
    }
    .btn-submit:active {
      transform: scale(0.98);
    }
    .btn-submit:disabled {
      opacity: 0.6;
      cursor: not-allowed;
    }

    .help-hint {
      font-size: 0.82rem;
      color: var(--text-sub);
      line-height: 1.5;
      margin-top: 12px;
    }

    /* Toast */
    .toast {
      position: fixed;
      bottom: max(20px, env(safe-area-inset-bottom, 20px));
      left: 50%;
      transform: translateX(-50%);
      padding: 10px 18px;
      border-radius: 9999px;
      font-size: 0.88rem;
      font-weight: 500;
      color: #ffffff;
      background: rgba(24, 24, 27, 0.95);
      border: 1px solid rgba(255, 255, 255, 0.15);
      box-shadow: 0 10px 25px rgba(0, 0, 0, 0.5);
      z-index: 1000;
      display: none;
      backdrop-filter: blur(8px);
      -webkit-backdrop-filter: blur(8px);
      white-space: nowrap;
    }
    .toast.success { border-color: #10b981; }
    .toast.error { border-color: #ef4444; }
  </style>
</head>
<body>
  <div id="toastEl" class="toast"></div>

  <!-- Top Navigation -->
  <header class="settings-nav">
    <a href="account.html" class="settings-back-link" id="backBtn">
      <svg viewBox="0 0 24 24"><polyline points="15 18 9 12 15 6"/></svg>
      <span id="backText">Settings</span>
    </a>
    <div class="nav-title" id="pageTitle">Edit Profile</div>
    <div class="nav-actions">
      <button type="button" class="lang-pill-btn" id="langToggleBtn" title="Language Switch">
        <span id="langBtnText">EN</span>
      </button>
    </div>
  </header>

  <main class="content-container">
    <!-- Avatar & Overview Card -->
    <div class="settings-card avatar-section">
      <div class="profile-avatar-giant" id="avatarLetter">Z</div>
      <div style="font-size: 1.25rem; font-weight: 700; color: #fff;" id="profileDisplayName">User</div>
      <div class="user-email-text" id="profileEmailDisplay">user@example.com</div>
      <div class="badges-row">
        <span class="badge-pill" id="profileRoleBadge">Member</span>
        <span class="badge-pill plan" id="profilePlanBadge">Free Plan</span>
      </div>
    </div>

    <!-- Edit Profile Form Card -->
    <div class="settings-card">
      <form id="profileUpdateForm">
        <div class="form-group">
          <label class="form-label" id="editNameLabel" for="editNameInput">Full Name</label>
          <input type="text" class="form-input" id="editNameInput" placeholder="Enter your full name" maxlength="50" required autocomplete="name">
        </div>
        <button type="submit" class="btn-submit" id="saveNameBtn">
          <span id="saveBtnText">Save Changes</span>
        </button>
      </form>
      <p class="help-hint" id="profileHintText">
        Your name will be visible across chats, shared sessions, and account summaries in Alokpoth.
      </p>
    </div>
  </main>

  <script>
    const isLocal = window.location.hostname === 'localhost' || window.location.hostname === '127.0.0.1';
    const BACKEND_URL = (isLocal && window.location.port === '5000') 
      ? window.location.origin 
      : (isLocal ? 'http://localhost:5000' : (window.location.origin.includes('vercel.app') ? window.location.origin : 'https://ai-zihan-xyz.vercel.app'));
    const API_BASE = BACKEND_URL + "/api";

    const token = localStorage.getItem("alokpoth_token");
    if (!token) {
      window.location.href = "login.html";
    }

    let currentLanguage = localStorage.getItem("alokpoth_lang") || "bn";
    const savedTheme = localStorage.getItem("alokpoth_theme") || localStorage.getItem("alokpoth-theme") || "oled";
    document.documentElement.setAttribute("data-theme", savedTheme);

    const I18N = {
      bn: {
        back: "সেটিংস",
        pageTitle: "প্রোফাইল পরিবর্তন",
        editNameLabel: "পূর্ণ নাম",
        placeholder: "আপনার পূর্ণ নাম লিখুন",
        saveBtn: "সংরক্ষণ করুন",
        saving: "সংরক্ষণ হচ্ছে...",
        hint: "আপনার নামটি Alokpoth-এর চ্যাট, শেয়ার্ড সেশন ও অ্যাকাউন্টের তথ্যে প্রদর্শিত হবে।",
        success: "আপনার নাম সফলভাবে আপডেট হয়েছে!",
        emptyErr: "নাম ফাঁকা রাখা যাবে না",
        serverErr: "সার্ভারের সাথে যোগাযোগ করা যায়নি",
        member: "সদস্য",
        admin: "Admin"
      },
      en: {
        back: "Settings",
        pageTitle: "Edit Profile",
        editNameLabel: "Full Name",
        placeholder: "Enter your full name",
        saveBtn: "Save Changes",
        saving: "Saving...",
        hint: "Your name will be visible across chats, shared sessions, and account summaries in Alokpoth.",
        success: "Your name has been updated successfully!",
        emptyErr: "Name cannot be empty",
        serverErr: "Could not connect to server",
        member: "Member",
        admin: "Admin"
      }
    };

    function showToast(msg, type = "success") {
      const el = document.getElementById("toastEl");
      if (!el) return;
      el.textContent = msg;
      el.className = `toast ${type}`;
      el.style.display = "block";
      setTimeout(() => { el.style.display = "none"; }, 3000);
    }

    function applyI18n() {
      const isEn = (currentLanguage === "en");
      const d = I18N[currentLanguage] || I18N.en;

      document.getElementById("langBtnText").textContent = isEn ? "বাং" : "EN";
      document.getElementById("backText").textContent = d.back;
      document.getElementById("pageTitle").textContent = d.pageTitle;
      document.getElementById("editNameLabel").textContent = d.editNameLabel;
      document.getElementById("editNameInput").placeholder = d.placeholder;
      document.getElementById("saveBtnText").textContent = d.saveBtn;
      document.getElementById("profileHintText").textContent = d.hint;
      document.title = `${d.pageTitle} — Alokpoth`;
    }

    function renderUserData(forceInputUpdate = false) {
      const userStr = localStorage.getItem("alokpoth_user");
      if (!userStr) return;
      const isEn = (currentLanguage === "en");
      try {
        const user = JSON.parse(userStr);
        const name = user.name || (isEn ? "User" : "ব্যবহারকারী");
        const email = user.email || "";

        document.getElementById("profileDisplayName").textContent = name;
        document.getElementById("profileEmailDisplay").textContent = email;
        document.getElementById("avatarLetter").textContent = (name || email || "U").charAt(0).toUpperCase();

        const editInput = document.getElementById("editNameInput");
        if (editInput && (!editInput.value || forceInputUpdate)) {
          editInput.value = user.name || "";
        }

        const adminEmails = ["zihanfakir@gmail.com", "x@zihan.uk"];
        const isAdmin = (user.role === "admin" || (user.email && adminEmails.includes(user.email.toLowerCase().trim())));
        
        document.getElementById("profileRoleBadge").textContent = isAdmin ? "Admin" : (isEn ? "Member" : "সদস্য");

        const pName = isAdmin ? "Max" : ((user.subscription && user.subscription.plan_name) || user.plan || localStorage.getItem("alokpoth_current_plan") || "Free");
        document.getElementById("profilePlanBadge").textContent = isAdmin ? (isEn ? "Admin (Unlimited)" : "অ্যাডমিন (সীমাহীন)") : `${pName} Plan`;
      } catch (e) {
        console.error(e);
      }
    }

    async function syncUserDataFromServer() {
      if (!token) return;
      try {
        const res = await fetch(`${API_BASE}/auth/me?_t=${Date.now()}`, {
          headers: { "Authorization": `Bearer ${token}` }
        });
        if (res.status === 401) {
          localStorage.removeItem("alokpoth_token");
          localStorage.removeItem("alokpoth_user");
          window.location.href = "login.html";
          return;
        }
        const data = await res.json();
        if (res.ok && data.success && data.user) {
          const freshUser = data.user;
          localStorage.setItem("alokpoth_user", JSON.stringify(freshUser));
          if (freshUser.name) {
            localStorage.setItem("alokpoth_account_name", freshUser.name);
          }
          const pName = (freshUser.subscription && freshUser.subscription.plan_name) || freshUser.plan || "Free";
          localStorage.setItem("alokpoth_current_plan", pName);
          renderUserData(false);
        }
      } catch (e) {
        console.warn("Could not sync user data from server:", e);
      }
    }

    // Back button smart navigation
    document.getElementById("backBtn")?.addEventListener("click", (e) => {
      if (window.history.length > 1 && document.referrer && document.referrer.includes(window.location.host)) {
        e.preventDefault();
        window.history.back();
      }
    });

    // Toggle Language
    document.getElementById("langToggleBtn")?.addEventListener("click", () => {
      currentLanguage = (currentLanguage === "en" ? "bn" : "en");
      try { localStorage.setItem("alokpoth_lang", currentLanguage); } catch {}
      applyI18n();
      renderUserData();
    });

    // Save profile form
    document.getElementById("profileUpdateForm")?.addEventListener("submit", async (e) => {
      e.preventDefault();
      const d = I18N[currentLanguage] || I18N.en;
      const newName = document.getElementById("editNameInput").value.trim();
      if (!newName) {
        showToast(d.emptyErr, "error");
        return;
      }

      const saveBtn = document.getElementById("saveNameBtn");
      const saveBtnText = document.getElementById("saveBtnText");
      saveBtn.disabled = true;
      saveBtnText.textContent = d.saving;

      try {
        const res = await fetch(`${API_BASE}/auth/profile`, {
          method: "PUT",
          headers: {
            "Content-Type": "application/json",
            "Authorization": `Bearer ${token}`
          },
          body: JSON.stringify({ name: newName })
        });
        const data = await res.json();
        if (res.ok && data.success) {
          const userStr = localStorage.getItem("alokpoth_user");
          let u = {};
          if (userStr) {
            try { u = JSON.parse(userStr); } catch {}
          }
          u.name = newName;
          if (data.user) {
            u = { ...u, ...data.user };
          }
          localStorage.setItem("alokpoth_user", JSON.stringify(u));
          localStorage.setItem("alokpoth_account_name", newName);
          showToast(d.success, "success");
          renderUserData(true);
        } else {
          showToast(data.error || d.serverErr, "error");
        }
      } catch {
        showToast(d.serverErr, "error");
      } finally {
        saveBtn.disabled = false;
        saveBtnText.textContent = d.saveBtn;
      }
    });

    applyI18n();
    renderUserData();
    syncUserDataFromServer();
  </script>
</body>
</html>

<!DOCTYPE html>
<html lang="bn">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
  <meta name="theme-color" content="#000000">
  <title>Edit Profile — Alora</title>
  <link rel="icon" type="image/svg+xml" href="favicon.svg?v=3">
  <link rel="icon" type="image/png" sizes="32x32" href="favicon-32x32.png?v=3">
  <link rel="icon" type="image/png" sizes="16x16" href="favicon-16x16.png?v=3">
  <link rel="shortcut icon" href="favicon.ico?v=3">
  <link rel="apple-touch-icon" sizes="180x180" href="apple-touch-icon.png?v=3">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Hind+Siliguri:wght@400;500;600;700&family=Plus+Jakarta+Sans:wght@400;500;600;700&display=swap" rel="stylesheet">
  
  <style>
    :root {
      --bg-base: #000000;
      --bg-card: #18181b;
      --bg-card-hover: #222226;
      --border-card: rgba(255, 255, 255, 0.08);
      --border-divider: rgba(255, 255, 255, 0.06);
      --text-main: #ffffff;
      --text-sub: #71717a;
      --text-dim: #a1a1aa;
      --accent-blue: #3b82f6;
      --accent-blue-hover: #2563eb;
      --accent-danger: #ef4444;
      --font-main: 'Plus Jakarta Sans', 'Hind Siliguri', -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
    }

    [data-theme="dark"] {
      --bg-base: #09090b;
      --bg-card: #18181b;
      --bg-card-hover: #222226;
      --border-card: rgba(255, 255, 255, 0.08);
      --border-divider: rgba(255, 255, 255, 0.06);
      --text-main: #ffffff;
      --text-sub: #71717a;
    }

    [data-theme="oled"] {
      --bg-base: #000000;
      --bg-card: #111113;
      --bg-card-hover: #1c1c1f;
      --border-card: rgba(255, 255, 255, 0.12);
      --border-divider: rgba(255, 255, 255, 0.06);
      --text-main: #ffffff;
      --text-sub: #71717a;
    }

    [data-theme="sapphire"] {
      --bg-base: #070d19;
      --bg-card: #0f1c32;
      --bg-card-hover: #152744;
      --border-card: rgba(56, 189, 248, 0.15);
      --border-divider: rgba(56, 189, 248, 0.08);
      --text-main: #f8fafc;
      --text-sub: #94a3b8;
    }

    [data-theme="eyecare"] {
      --bg-base: #f5eedc;
      --bg-card: #eadeca;
      --bg-card-hover: #dfcfb8;
      --border-card: rgba(146, 64, 14, 0.15);
      --border-divider: rgba(146, 64, 14, 0.08);
      --text-main: #4a3b2c;
      --text-sub: #7a6b5c;
      --text-dim: #9e8e7e;
    }

    [data-theme="light"] {
      --bg-base: #f4f4f5;
      --bg-card: #ffffff;
      --bg-card-hover: #f8fafc;
      --border-card: rgba(0, 0, 0, 0.08);
      --border-divider: rgba(0, 0, 0, 0.05);
      --text-main: #09090b;
      --text-sub: #71717a;
      --text-dim: #52525b;
    }

    *, *::before, *::after {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      -webkit-tap-highlight-color: transparent !important;
      -webkit-font-smoothing: antialiased;
    }

    a {
      text-decoration: none !important;
      color: inherit;
    }

    body {
      font-family: var(--font-main);
      background-color: var(--bg-base);
      color: var(--text-main);
      min-height: 100vh;
      display: flex;
      flex-direction: column;
      position: relative;
      overflow-x: hidden;
      padding-bottom: max(32px, env(safe-area-inset-bottom, 20px));
      transition: background-color 0.2s ease;
    }

    /* Top Navigation Bar */
    .settings-nav {
      position: sticky;
      top: 0;
      z-index: 50;
      background: var(--bg-base);
      border-bottom: 1px solid var(--border-divider);
      display: flex;
      align-items: center;
      justify-content: space-between;
      height: calc(56px + env(safe-area-inset-top, 0px));
      padding: env(safe-area-inset-top, 0px) 16px 0 16px;
      backdrop-filter: blur(12px);
      -webkit-backdrop-filter: blur(12px);
    }

    .settings-back-link {
      display: inline-flex;
      align-items: center;
      gap: 6px;
      color: var(--text-main);
      text-decoration: none;
      font-size: 1rem;
      font-weight: 600;
      cursor: pointer;
      padding: 6px 8px;
      border-radius: 8px;
      transition: opacity 0.15s;
    }
    .settings-back-link:active {
      opacity: 0.7;
    }
    .settings-back-link svg {
      width: 20px;
      height: 20px;
      stroke-width: 2.4;
      stroke: currentColor;
      fill: none;
      stroke-linecap: round;
      stroke-linejoin: round;
    }

    .nav-title {
      font-size: 1.05rem;
      font-weight: 700;
      color: var(--text-main);
    }

    .nav-actions {
      display: flex;
      align-items: center;
      gap: 10px;
    }

    .lang-pill-btn {
      background: var(--bg-card-hover, rgba(128, 128, 128, 0.08));
      border: 1px solid var(--border-card);
      color: var(--text-main);
      font-size: 0.8rem;
      font-weight: 600;
      padding: 5px 10px;
      border-radius: 9999px;
      cursor: pointer;
      transition: background 0.15s;
    }
    .lang-pill-btn:active {
      opacity: 0.8;
    }

    /* Main Container */
    .content-container {
      width: 100%;
      max-width: 580px;
      margin: 0 auto;
      padding: 20px 16px 40px;
      display: flex;
      flex-direction: column;
      gap: 16px;
    }

    .settings-card {
      background: var(--bg-card);
      border: 1px solid var(--border-card);
      border-radius: 16px;
      padding: 20px;
      box-shadow: 0 2px 8px rgba(0, 0, 0, 0.2);
    }

    .avatar-section {
      display: flex;
      flex-direction: column;
      align-items: center;
      text-align: center;
      padding: 24px 16px 20px;
      gap: 12px;
    }

    .profile-avatar-giant {
      width: 88px;
      height: 88px;
      border-radius: 50%;
      background: linear-gradient(135deg, #2563eb, #38bdf8);
      color: #ffffff;
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 2.2rem;
      font-weight: 800;
      box-shadow: 0 8px 24px rgba(37, 99, 235, 0.25);
      border: 2px solid var(--border-card);
      overflow: hidden;
      flex-shrink: 0;
      position: relative;
    }
    .profile-avatar-giant img {
      width: 100%;
      height: 100%;
      border-radius: 50%;
      object-fit: cover;
      display: block;
    }

    .profile-name-text {
      font-size: 1.25rem;
      font-weight: 700;
      color: var(--text-main);
    }

    .user-email-text {
      font-size: 0.92rem;
      color: var(--text-sub);
      font-weight: 500;
    }

    .badges-row {
      display: flex;
      gap: 8px;
      justify-content: center;
      margin-top: 4px;
    }

    .badge-pill {
      font-size: 0.78rem;
      padding: 3px 10px;
      border-radius: 9999px;
      font-weight: 600;
      background: rgba(59, 130, 246, 0.15);
      color: #60a5fa;
      border: 1px solid rgba(59, 130, 246, 0.3);
    }
    .badge-pill.plan {
      background: var(--bg-card-hover, rgba(128, 128, 128, 0.08));
      color: var(--text-sub);
      border: 1px solid var(--border-card);
    }

    /* Avatar Picker Card */
    .avatar-picker-card {
      display: flex;
      flex-direction: column;
      gap: 14px;
    }
    .picker-header {
      display: flex;
      flex-direction: column;
      gap: 4px;
    }
    .picker-title {
      font-size: 1rem;
      font-weight: 700;
      color: var(--text-main);
    }
    .picker-sub {
      font-size: 0.82rem;
      color: var(--text-sub);
      line-height: 1.4;
    }
    .avatar-grid {
      display: grid;
      grid-template-columns: repeat(auto-fill, minmax(56px, 1fr));
      gap: 12px;
      padding-top: 4px;
    }
    .avatar-option {
      position: relative;
      aspect-ratio: 1 / 1;
      width: 100%;
      border-radius: 50%;
      border: 2px solid var(--border-card);
      background: var(--bg-card-hover, rgba(128, 128, 128, 0.08));
      cursor: pointer;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 0;
      overflow: visible;
      transition: transform 0.15s ease, border-color 0.15s ease, box-shadow 0.15s ease;
      outline: none;
    }
    .avatar-option:hover {
      transform: scale(1.08);
      border-color: rgba(59, 130, 246, 0.5);
    }
    .avatar-option.selected {
      border-color: var(--accent-blue);
      box-shadow: 0 0 0 3px rgba(59, 130, 246, 0.35);
      transform: scale(1.05);
    }
    .avatar-option img {
      width: 100%;
      height: 100%;
      border-radius: 50%;
      object-fit: cover;
      display: block;
      pointer-events: none;
    }
    .avatar-option.default-initial {
      font-weight: 800;
      font-size: 1.2rem;
      color: #ffffff;
      background: linear-gradient(135deg, #2563eb, #38bdf8);
      border-color: transparent;
    }
    .avatar-option-badge {
      position: absolute;
      bottom: -2px;
      right: -2px;
      width: 18px;
      height: 18px;
      border-radius: 50%;
      background: var(--accent-blue);
      color: #ffffff;
      display: none;
      align-items: center;
      justify-content: center;
      border: 2px solid var(--bg-card);
      box-shadow: 0 2px 6px rgba(0, 0, 0, 0.3);
      z-index: 2;
    }
    .avatar-option.selected .avatar-option-badge {
      display: flex;
    }

    .form-group {
      margin-bottom: 16px;
    }

    .form-label {
      display: block;
      font-size: 0.88rem;
      font-weight: 600;
      color: var(--text-sub);
      margin-bottom: 8px;
    }

    .form-input {
      width: 100%;
      height: 48px;
      padding: 0 16px;
      background: var(--bg-card-hover, rgba(128, 128, 128, 0.08));
      border: 1px solid var(--border-card);
      border-radius: 12px;
      color: var(--text-main);
      font-size: 0.98rem;
      font-family: inherit;
      outline: none;
      transition: border-color 0.15s, box-shadow 0.15s;
    }
    .form-input::placeholder {
      color: var(--text-sub);
    }
    .form-input:focus {
      border-color: var(--accent-blue);
      box-shadow: 0 0 0 3px rgba(59, 130, 246, 0.25);
    }

    .btn-submit {
      width: 100%;
      height: 48px;
      border-radius: 12px;
      background: var(--accent-blue);
      color: #ffffff;
      border: none;
      font-size: 1rem;
      font-weight: 600;
      font-family: inherit;
      cursor: pointer;
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 8px;
      transition: background 0.15s;
      margin-top: 10px;
    }
    .btn-submit:hover {
      background: var(--accent-blue-hover);
    }
    .btn-submit:active {
      transform: scale(0.98);
    }
    .btn-submit:disabled {
      opacity: 0.6;
      cursor: not-allowed;
    }

    .help-hint {
      font-size: 0.82rem;
      color: var(--text-sub);
      line-height: 1.5;
      margin-top: 12px;
    }

    /* Light Mode Theme Refinements */
    [data-theme="light"] .settings-card {
      background: #ffffff !important;
      border: 1px solid rgba(0, 0, 0, 0.08) !important;
      box-shadow: 0 4px 20px -2px rgba(0, 0, 0, 0.05), 0 1px 3px rgba(0, 0, 0, 0.03) !important;
    }
    [data-theme="light"] .profile-name-text {
      color: #09090b !important;
    }
    [data-theme="light"] .form-input {
      background: #f4f4f5 !important;
      border: 1px solid rgba(0, 0, 0, 0.12) !important;
      color: #09090b !important;
    }
    [data-theme="light"] .form-input:focus {
      background: #ffffff !important;
      border-color: #2563eb !important;
      box-shadow: 0 0 0 3px rgba(37, 99, 235, 0.15) !important;
    }
    [data-theme="light"] .avatar-option {
      background: #f4f4f5 !important;
      border-color: rgba(0, 0, 0, 0.1) !important;
    }
    [data-theme="light"] .avatar-option.selected {
      border-color: #2563eb !important;
      box-shadow: 0 0 0 3px rgba(37, 99, 235, 0.25) !important;
    }
    [data-theme="light"] .avatar-option-badge {
      border-color: #ffffff !important;
    }
    [data-theme="light"] .badge-pill.plan {
      background: #f4f4f5 !important;
      color: #71717a !important;
      border: 1px solid rgba(0, 0, 0, 0.08) !important;
    }
    [data-theme="light"] .badge-pill {
      background: rgba(37, 99, 235, 0.1) !important;
      color: #2563eb !important;
      border: 1px solid rgba(37, 99, 235, 0.2) !important;
    }
    [data-theme="light"] .lang-pill-btn {
      background: #f4f4f5 !important;
      border-color: rgba(0, 0, 0, 0.1) !important;
      color: #09090b !important;
    }

    /* Eyecare Mode Theme Refinements */
    [data-theme="eyecare"] .settings-card {
      background: #fbf7ef !important;
      border: 1px solid rgba(146, 64, 14, 0.15) !important;
      box-shadow: 0 4px 20px -2px rgba(74, 59, 44, 0.06) !important;
    }
    [data-theme="eyecare"] .profile-name-text {
      color: #4a3b2c !important;
    }
    [data-theme="eyecare"] .form-input {
      background: #f5eedc !important;
      border: 1px solid rgba(146, 64, 14, 0.2) !important;
      color: #4a3b2c !important;
    }
    [data-theme="eyecare"] .form-input:focus {
      background: #ffffff !important;
      border-color: #92400e !important;
      box-shadow: 0 0 0 3px rgba(146, 64, 14, 0.18) !important;
    }
    [data-theme="eyecare"] .avatar-option {
      background: #f5eedc !important;
      border-color: rgba(146, 64, 14, 0.2) !important;
    }
    [data-theme="eyecare"] .avatar-option.selected {
      border-color: #92400e !important;
      box-shadow: 0 0 0 3px rgba(146, 64, 14, 0.25) !important;
    }
    [data-theme="eyecare"] .avatar-option-badge {
      background: #92400e !important;
      border-color: #fbf7ef !important;
    }
    [data-theme="eyecare"] .btn-submit {
      background: #92400e !important;
    }

    /* Toast */
    .toast {
      position: fixed;
      bottom: max(20px, env(safe-area-inset-bottom, 20px));
      left: 50%;
      transform: translateX(-50%);
      padding: 10px 18px;
      border-radius: 9999px;
      font-size: 0.88rem;
      font-weight: 500;
      color: #ffffff;
      background: rgba(24, 24, 27, 0.95);
      border: 1px solid rgba(255, 255, 255, 0.15);
      box-shadow: 0 10px 25px rgba(0, 0, 0, 0.5);
      z-index: 1000;
      display: none;
      backdrop-filter: blur(8px);
      -webkit-backdrop-filter: blur(8px);
      white-space: nowrap;
    }
    .toast.success { border-color: #10b981; }
    .toast.error { border-color: #ef4444; }
  </style>
<script>
  (function() {
    try {
      var saved = localStorage.getItem("alokpoth_theme") || localStorage.getItem("alokpoth-theme") || "system";
      if (saved === "system") {
        var isDark = window.matchMedia && window.matchMedia('(prefers-color-scheme: dark)').matches;
        saved = isDark ? "dark" : "light";
      }
      document.documentElement.setAttribute("data-theme", saved);
    } catch(e) {}
    if (window.location.pathname.endsWith('.html')) {
      var clean = window.location.pathname.replace(/\.html$/, '');
      if (clean === '/index') clean = '/';
      window.history.replaceState(null, '', clean + window.location.search + window.location.hash);
    }
  })();
</script>
</head>
<body>
  <div id="toastEl" class="toast"></div>

  <!-- Top Navigation -->
  <header class="settings-nav">
    <a href="account" class="settings-back-link" id="backBtn">
      <svg viewBox="0 0 24 24"><polyline points="15 18 9 12 15 6"/></svg>
      <span id="backText">Settings</span>
    </a>
    <div class="nav-title" id="pageTitle">Edit Profile</div>
    <div class="nav-actions">
      <button type="button" class="lang-pill-btn" id="langToggleBtn" title="Language Switch">
        <span id="langBtnText">EN</span>
      </button>
    </div>
  </header>

  <main class="content-container">
    <!-- Avatar & Overview Card -->
    <div class="settings-card avatar-section">
      <div class="profile-avatar-giant" id="avatarLetter">Z</div>
      <div class="profile-name-text" id="profileDisplayName">User</div>
      <div class="user-email-text" id="profileEmailDisplay">user@example.com</div>
      <div class="badges-row">
        <span class="badge-pill" id="profileRoleBadge">Member</span>
        <span class="badge-pill plan" id="profilePlanBadge">Free Plan</span>
      </div>
    </div>

    <!-- Avatar Selection Card -->
    <div class="settings-card avatar-picker-card">
      <div class="picker-header">
        <div class="picker-title" id="avatarPickerTitle">Choose Avatar</div>
        <div class="picker-sub" id="avatarPickerSub">Select a minimal avatar or use your name initial</div>
      </div>
      <div class="avatar-grid" id="avatarGrid"></div>
    </div>

    <!-- Edit Profile Form Card -->
    <div class="settings-card">
      <form id="profileUpdateForm">
        <div class="form-group">
          <label class="form-label" id="editNameLabel" for="editNameInput">Full Name</label>
          <input type="text" class="form-input" id="editNameInput" placeholder="Enter your full name" maxlength="50" required autocomplete="name">
        </div>
        <button type="submit" class="btn-submit" id="saveNameBtn">
          <span id="saveBtnText">Save Changes</span>
        </button>
      </form>
      <p class="help-hint" id="profileHintText">
        Your name will be visible across chats, shared sessions, and account summaries in Alora.
      </p>
    </div>
  </main>

  <script>
    const isLocal = window.location.hostname === 'localhost' || window.location.hostname === '127.0.0.1';
    const BACKEND_URL = (isLocal && window.location.port === '5000') 
      ? window.location.origin 
      : (isLocal ? 'http://localhost:5000' : (window.location.origin.includes('vercel.app') ? window.location.origin : 'https://ai-zihan-xyz.vercel.app'));
    const API_BASE = BACKEND_URL + "/api";

    const token = localStorage.getItem("alokpoth_token");
    if (!token) {
      window.location.href = "login";
    }

    let currentLanguage = localStorage.getItem("alokpoth_lang") || "bn";
    const rawSavedTheme = localStorage.getItem("alokpoth_theme") || localStorage.getItem("alokpoth-theme") || "system";
    const isDarkProfile = window.matchMedia && window.matchMedia('(prefers-color-scheme: dark)').matches;
    const savedTheme = (rawSavedTheme === "system") ? (isDarkProfile ? "dark" : "light") : rawSavedTheme;
    document.documentElement.setAttribute("data-theme", savedTheme);

    const MINIMAL_AVATARS = [
      { id: "default", path: "default", name: "Letter Initial", isInitial: true },
      { id: "avatar_1.svg", path: "avatars/avatar_1.svg", name: "Cosmic Orb" },
      { id: "avatar_2.svg", path: "avatars/avatar_2.svg", name: "Emerald Star" },
      { id: "avatar_3.svg", path: "avatars/avatar_3.svg", name: "Geometric Fox" },
      { id: "avatar_4.svg", path: "avatars/avatar_4.svg", name: "Amethyst Crystal" },
      { id: "avatar_5.svg", path: "avatars/avatar_5.svg", name: "Ocean Wave" },
      { id: "avatar_6.svg", path: "avatars/avatar_6.svg", name: "Cyber Astronaut" },
      { id: "avatar_7.svg", path: "avatars/avatar_7.svg", name: "Minimal Cat" },
      { id: "avatar_8.svg", path: "avatars/avatar_8.svg", name: "Cute Bot" },
      { id: "avatar_9.svg", path: "avatars/avatar_9.svg", name: "Phoenix Flame" },
      { id: "avatar_10.svg", path: "avatars/avatar_10.svg", name: "Zen Leaf" },
      { id: "avatar_11.svg", path: "avatars/avatar_11.svg", name: "Neon Bolt" },
      { id: "avatar_12.svg", path: "avatars/avatar_12.svg", name: "Night Moon" }
    ];
    let selectedAvatar = "default";

    const I18N = {
      bn: {
        back: "সেটিংস",
        pageTitle: "প্রোফাইল পরিবর্তন",
        avatarTitle: "অবতার নির্বাচন করুন",
        avatarSub: "একটি মিনিমাল অবতার বা নামের প্রথম অক্ষর বেছে নিন",
        initialOption: "অক্ষর",
        editNameLabel: "পূর্ণ নাম",
        placeholder: "আপনার পূর্ণ নাম লিখুন",
        saveBtn: "সংরক্ষণ করুন",
        saving: "সংরক্ষণ হচ্ছে...",
        hint: "আপনার নামটি Alora-এর চ্যাট, শেয়ার্ড সেশন ও অ্যাকাউন্টের তথ্যে প্রদর্শিত হবে।",
        success: "প্রোফাইল সফলভাবে আপডেট হয়েছে!",
        emptyErr: "নাম ফাঁকা রাখা যাবে না",
        serverErr: "সার্ভারের সাথে যোগাযোগ করা যায়নি",
        member: "সদস্য",
        admin: "Admin"
      },
      en: {
        back: "Settings",
        pageTitle: "Edit Profile",
        avatarTitle: "Choose Avatar",
        avatarSub: "Select a minimal avatar or use your initial letter",
        initialOption: "Initial",
        editNameLabel: "Full Name",
        placeholder: "Enter your full name",
        saveBtn: "Save Changes",
        saving: "Saving...",
        hint: "Your name will be visible across chats, shared sessions, and account summaries in Alora.",
        success: "Profile updated successfully!",
        emptyErr: "Name cannot be empty",
        serverErr: "Could not connect to server",
        member: "Member",
        admin: "Admin"
      }
    };

    function showToast(msg, type = "success") {
      const el = document.getElementById("toastEl");
      if (!el) return;
      el.textContent = msg;
      el.className = `toast ${type}`;
      el.style.display = "block";
      setTimeout(() => { el.style.display = "none"; }, 3000);
    }

    function updateAvatarDisplay(avatarPath, name) {
      const avatarEl = document.getElementById("avatarLetter");
      if (!avatarEl) return;
      const initial = (name || "U").trim().charAt(0).toUpperCase() || "U";
      if (avatarPath && avatarPath !== "default") {
        avatarEl.innerHTML = `<img src="${avatarPath}" alt="Avatar">`;
        avatarEl.style.background = "none";
      } else {
        avatarEl.innerHTML = '';
        avatarEl.textContent = initial;
        avatarEl.style.background = "linear-gradient(135deg, #2563eb, #38bdf8)";
      }
    }

    function renderAvatarGrid(currentInitial = "U") {
      const grid = document.getElementById("avatarGrid");
      if (!grid) return;
      grid.innerHTML = "";
      MINIMAL_AVATARS.forEach(item => {
        const btn = document.createElement("button");
        btn.type = "button";
        btn.className = `avatar-option ${item.isInitial ? 'default-initial' : ''} ${selectedAvatar === item.path ? 'selected' : ''}`;
        btn.dataset.avatar = item.path;
        btn.title = item.name;

        if (item.isInitial) {
          btn.innerHTML = `<span class="initial-letter-text">${currentInitial}</span>
            <span class="avatar-option-badge">
              <svg viewBox="0 0 24 24" width="10" height="10" stroke="currentColor" stroke-width="3" fill="none" stroke-linecap="round" stroke-linejoin="round"><polyline points="20 6 9 17 4 12"/></svg>
            </span>`;
        } else {
          btn.innerHTML = `<img src="${item.path}" alt="${item.name}" loading="lazy">
            <span class="avatar-option-badge">
              <svg viewBox="0 0 24 24" width="10" height="10" stroke="currentColor" stroke-width="3" fill="none" stroke-linecap="round" stroke-linejoin="round"><polyline points="20 6 9 17 4 12"/></svg>
            </span>`;
        }

        btn.addEventListener("click", () => {
          selectedAvatar = item.path;
          document.querySelectorAll(".avatar-option").forEach(b => b.classList.remove("selected"));
          btn.classList.add("selected");
          const nameInput = document.getElementById("editNameInput");
          const curName = (nameInput && nameInput.value.trim()) || document.getElementById("profileDisplayName")?.textContent || "U";
          updateAvatarDisplay(selectedAvatar, curName);
        });

        grid.appendChild(btn);
      });
    }

    function applyI18n() {
      const isEn = (currentLanguage === "en");
      const d = I18N[currentLanguage] || I18N.en;

      document.getElementById("langBtnText").textContent = isEn ? "বাং" : "EN";
      document.getElementById("backText").textContent = d.back;
      document.getElementById("pageTitle").textContent = d.pageTitle;
      const avatarTitleEl = document.getElementById("avatarPickerTitle");
      if (avatarTitleEl) avatarTitleEl.textContent = d.avatarTitle;
      const avatarSubEl = document.getElementById("avatarPickerSub");
      if (avatarSubEl) avatarSubEl.textContent = d.avatarSub;
      document.getElementById("editNameLabel").textContent = d.editNameLabel;
      document.getElementById("editNameInput").placeholder = d.placeholder;
      document.getElementById("saveBtnText").textContent = d.saveBtn;
      document.getElementById("profileHintText").textContent = d.hint;
      document.title = `${d.pageTitle} — Alora`;
    }

    function renderUserData(forceInputUpdate = false) {
      const userStr = localStorage.getItem("alokpoth_user");
      if (!userStr) return;
      const isEn = (currentLanguage === "en");
      try {
        const user = JSON.parse(userStr);
        const name = user.name || (isEn ? "User" : "ব্যবহারকারী");
        const email = user.email || "";
        const initial = (name || email || "U").trim().charAt(0).toUpperCase() || "U";

        document.getElementById("profileDisplayName").textContent = name;
        document.getElementById("profileEmailDisplay").textContent = email;

        selectedAvatar = user.avatar || localStorage.getItem("alokpoth_user_avatar") || "default";
        updateAvatarDisplay(selectedAvatar, name);
        renderAvatarGrid(initial);

        const editInput = document.getElementById("editNameInput");
        if (editInput && (!editInput.value || forceInputUpdate)) {
          editInput.value = user.name || "";
        }

        const adminEmails = ["zihanfakir@gmail.com", "x@zihan.uk"];
        const isAdmin = (user.role === "admin" || (user.email && adminEmails.includes(user.email.toLowerCase().trim())));
        
        document.getElementById("profileRoleBadge").textContent = isAdmin ? "Admin" : (isEn ? "Member" : "সদস্য");

        const pName = isAdmin ? "Max" : ((user.subscription && user.subscription.plan_name) || user.plan || localStorage.getItem("alokpoth_current_plan") || "Free");
        document.getElementById("profilePlanBadge").textContent = isAdmin ? (isEn ? "Admin (Unlimited)" : "অ্যাডমিন (সীমাহীন)") : `${pName} Plan`;
      } catch (e) {
        console.error(e);
      }
    }

    async function syncUserDataFromServer() {
      if (!token) return;
      try {
        const res = await fetch(`${API_BASE}/auth/me?_t=${Date.now()}`, {
          headers: { "Authorization": `Bearer ${token}` }
        });
        if (res.status === 401) {
          localStorage.removeItem("alokpoth_token");
          localStorage.removeItem("alokpoth_user");
          window.location.href = "login";
          return;
        }
        const data = await res.json();
        if (res.ok && data.success && data.user) {
          const freshUser = data.user;
          localStorage.setItem("alokpoth_user", JSON.stringify(freshUser));
          if (freshUser.name) {
            localStorage.setItem("alokpoth_account_name", freshUser.name);
          }
          if (freshUser.avatar) {
            localStorage.setItem("alokpoth_user_avatar", freshUser.avatar);
          }
          const pName = (freshUser.subscription && freshUser.subscription.plan_name) || freshUser.plan || "Free";
          localStorage.setItem("alokpoth_current_plan", pName);
          renderUserData(false);
        }
      } catch (e) {
        console.warn("Could not sync user data from server:", e);
      }
    }

    // Back button smart navigation
    document.getElementById("backBtn")?.addEventListener("click", (e) => {
      if (window.history.length > 1 && document.referrer && document.referrer.includes(window.location.host)) {
        e.preventDefault();
        window.history.back();
      }
    });

    // Toggle Language
    document.getElementById("langToggleBtn")?.addEventListener("click", () => {
      currentLanguage = (currentLanguage === "en" ? "bn" : "en");
      try { localStorage.setItem("alokpoth_lang", currentLanguage); } catch {}
      applyI18n();
      renderUserData();
    });

    // Live update initial on name input
    document.getElementById("editNameInput")?.addEventListener("input", (e) => {
      const val = e.target.value.trim();
      const initial = val ? val.charAt(0).toUpperCase() : "U";
      const initialText = document.querySelector(".initial-letter-text");
      if (initialText) initialText.textContent = initial;
      if (selectedAvatar === "default") {
        updateAvatarDisplay("default", val || "U");
      }
    });

    // Save profile form
    document.getElementById("profileUpdateForm")?.addEventListener("submit", async (e) => {
      e.preventDefault();
      const d = I18N[currentLanguage] || I18N.en;
      const newName = document.getElementById("editNameInput").value.trim();
      if (!newName) {
        showToast(d.emptyErr, "error");
        return;
      }

      const saveBtn = document.getElementById("saveNameBtn");
      const saveBtnText = document.getElementById("saveBtnText");
      saveBtn.disabled = true;
      saveBtnText.textContent = d.saving;

      try {
        const res = await fetch(`${API_BASE}/auth/profile`, {
          method: "PUT",
          headers: {
            "Content-Type": "application/json",
            "Authorization": `Bearer ${token}`
          },
          body: JSON.stringify({ name: newName, avatar: selectedAvatar })
        });
        const data = await res.json();
        if (res.ok && data.success) {
          const userStr = localStorage.getItem("alokpoth_user");
          let u = {};
          if (userStr) {
            try { u = JSON.parse(userStr); } catch {}
          }
          u.name = newName;
          u.avatar = selectedAvatar;
          if (data.user) {
            u = { ...u, ...data.user };
          }
          localStorage.setItem("alokpoth_user", JSON.stringify(u));
          localStorage.setItem("alokpoth_account_name", newName);
          localStorage.setItem("alokpoth_user_avatar", selectedAvatar);
          showToast(d.success, "success");
          renderUserData(true);
        } else {
          showToast(data.error || d.serverErr, "error");
        }
      } catch {
        showToast(d.serverErr, "error");
      } finally {
        saveBtn.disabled = false;
        saveBtnText.textContent = d.saveBtn;
      }
    });

    applyI18n();
    renderUserData();
    syncUserDataFromServer();
  </script>
</body>
</html>
